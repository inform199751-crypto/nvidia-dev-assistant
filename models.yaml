# 模型註冊表 —— 換模型改這裡,不用改程式碼。
# LLM_BACKEND=catalog → build.nvidia.com(PoC);LLM_BACKEND=nim → 地端 NIM 容器(每個模型一個容器)
#
# 2026-10-05 查證(catalog 汰換很快,上線前再對一次):
#   deepseek-ai/deepseek-v3 系列(v3 / v3.1 / v3.2)  → 已從 catalog 移除(404)
#   qwen/qwen2.5-coder-32b-instruct                   → catalog 2026-05-12 EOL,只剩地端 NIM 1.x
#   nvidia/nemotron-3-ultra-550b-a55b / super-120b    → 可用,tool calling 2026-10-05 實測通過
#   deepseek-ai/deepseek-v4.1-flash                   → 可用,2026-10-06 冒煙測試四項全過
#   nvidia/nemotron-3-nano-omni-30b-a3b-reasoning     → 看圖,2026-10-09 實測(見下面 vision)
#   microsoft/phi-3-vision-128k-instruct、nvidia/cosmos-reason2-8b → 模型清單上有,實際呼叫 404
#
# context_window 填「我們允許用到」的長度,不是模型理論上限。
# 地端跟 catalog 不同時另寫 nim_context_window(LLM_BACKEND=nim 時取代 context_window),
# 部署 NIM 時 NIM_MAX_MODEL_LEN 要設成這個值。
# 這個數字決定 KV cache 要預留多少顯存,開越大、能同時服務的人越少。

backends:
  catalog:
    base_url: https://integrate.api.nvidia.com/v1
    api_key_env: NVIDIA_API_KEY
    company_data: false   # 試用平台:條款允許 NVIDIA 收集輸入輸出、禁止正式使用 → 不能放公司資料(guard.check_folder 會擋)
  nim:
    base_url: http://localhost:8000/v1   # 角色沒寫 nim_base_url 時用這個
    api_key_env: null                    # NIM 本身不驗 key,驗證交給前面的 API Gateway
    company_data: true                   # 公司自己的伺服器,資料不出公司
    # 聽寫、語音模式、自然語音要把說話的聲音和回答的文字送到瀏覽器廠商(微軟 / Google)的雲端 —— 地端預設關,
    # 公司核准了那家的語音服務再改 true。沒寫的話:能放公司資料的後端就關、試用平台就開
    cloud_voice: false

routing:
  default_role: code
  long_context_role: long_context
  safety_margin: 0.10   # 估算誤差 + 工具定義的 token,先扣掉 10%
  vision_role: vision   # 有圖片的那一題,先請它把圖片轉成文字再交給主模型(agent.describe_images)
  # 依難度選模型(difficulty.py):每輪開始先請分類器判斷「一般 / 難題」,難題改用 hard_role。
  #   off 不判斷 · shadow 在背景判斷、只記錄「本來會選哪個」,實際仍用 default_role、不等它 · on 等判斷結果再切換
  # 先用 shadow 累積紀錄(output/routing_log.jsonl),python report_routing.py 看準不準再改 on。
  # 2026-10-25 改 on:端到端評測 17 題(run_evals.py),依難度選模型 16/17、平均 50.1k tokens;
  #   只用 3.5 Super VL 兩次都 12/17、平均 65.8k / 78.8k(難題常做到 15 步上限)。分類器跟出題難度只有 9/15 一致,
  #   但判斷錯的那幾題也都答對了;多花的是每輪約 300 tokens、約 1 秒。
  # 緊急關閉不用改這裡:環境變數 DIFFICULTY_ROUTING=off(改回影子模式:DIFFICULTY_ROUTING=shadow)。使用者用 --role 指定時不判斷。
  difficulty:
    mode: "on"              # 要加引號:YAML 會把沒引號的 on / off 讀成 True / False
    classifier_role: code   # Super 關思考,約 1 秒;資料不出公司(地端一樣用自己的 NIM)
    hard_role: code_deep    # 也用在:一般模型做到步數上限時,問使用者要不要換它接著做(不管 mode)
    timeout_s: 20           # 分類器逾時就照預設,不讓整題卡住(只有 on 會等它)
    classifier: llm         # llm = 問 Super;tree = 用自己訓練的決策樹(train_models.py,不花 token、不用等;
                            #   還沒訓練就自動退回 llm)。先看 report_routing.py 的「一致率」夠高再換

# 知識庫(knowledge.py):把文件段落和問題轉成向量,照意思找。2026-10-09 實測 12 題「換句話說」的中文問題(demo_knowledge/):
#   Nemotron 3 Embed 第 1 名命中 10/12、前 3 名 12/12;Llama Nemotron Embed VL 一樣 10/12;關鍵字(BM25)只有 7/12、8/12
#   清單上的 llama-3.2-nv-embedqa-1b-v1、nv-embedqa-mistral-7b-v2、arctic-embed-l、embed-qa-4 實際呼叫都 404
# 換模型之後,每個知識庫下次「更新」會全部重算向量
embedding:
  model: nvidia/nemotron-3-embed-1b
  nim_base_url: http://nim-nemotron-embed:8000/v1
  timeout_s: 60

# 安全把關(guard.py):上網讀到的內容、訪客的問題,先讓它檢查(藏在網頁裡要 AI 照做的指令、不當內容)。
# 2026-10-10 實測 5 題(正常網頁 / 惡意網頁 / 隱晦的提示注入 / 不當請求 / 正常請求):
#   Nemotron 3.5 Content Safety 全對,每次約 0.7 秒;NemoGuard 8B content safety、Llama Guard 4 全部逾時(60 秒);
#   Safety Guard 8B v3 對了 3 題、4–28 秒,其他逾時
# 檢查失敗(逾時、忙線)不擋,只提醒模型(guard.py 開頭有寫為什麼)
safety:
  model: nvidia/nemotron-3.5-content-safety
  nim_base_url: http://nim-content-safety:8000/v1
  timeout_s: 10

# 畫圖(imagegen.py 的 generate_image,10/26):catalog 的畫圖模型在另一組網址(base_url/<模型>),不在上面的 /v1/chat。
# 2026-10-26 實測(「白色桌上的紅蘋果」1024×1024):FLUX.1-dev 4.8 秒、品質好;FLUX.1-schnell 這次逾時;
#   Stable Diffusion 3 Medium、3.5 Large、SDXL、SDXL Turbo 都 404 → 主力 FLUX.1-dev,schnell 當備援
# 2026-10-30 使用者請它畫雨天的 101,等了 3 分多鐘失敗:FLUX.1-dev 等 60–70 秒回 500、schnell 等 240 秒都沒回(連試 4 次都這樣)。
#   找到新上架的 FLUX.2 klein 4B:橫幅 4.1 秒、方形 3.1 秒,雨夜、倒影都畫得出來(4B,建築細節比 FLUX.1-dev 差)
#   → klein 先畫、FLUX.1-dev 備援;schnell 兩次實測都逾時,拿掉。每顆最多等 60 秒(原本 120,兩顆加起來最多 2 分鐘)
#   klein 的寬高是 512–1568、16 的倍數,FLUX.1-dev 是 768–1344、64 的倍數;imagegen.SIZES 兩顆都要收得下
# 地端要另外部署 FLUX 的 NIM,部署好再把 nim 加進 available_on、填 nim_base_url
image:
  base_url: https://ai.api.nvidia.com/v1/genai
  available_on: [catalog]
  timeout_s: 60
  models:
    - {model: black-forest-labs/flux.2-klein-4b}
    - {model: black-forest-labs/flux.1-dev, params: {mode: base, cfg_scale: 3.5, steps: 30}}

limits:
  max_agent_steps: 15
  max_execute_steps: 25             # 照計畫執行(/plan 同意後)的步數上限:要做的事比一般問答多
  max_subagent_steps: 8             # delegate 的子 agent:只調查一個小問題、回一段結論
  summarize_at: 0.6                 # 對話超過預設模型預算的 6 成,下一題開始前先整理成摘要
  tool_output_max_tokens: 4000      # 單次工具輸出上限(測試 log 很容易爆)
  inline_file_max_tokens: 24000     # 超過就只給大綱,讓 agent 用工具分段讀
  daily_tokens_per_user: 2000000
  max_concurrent_per_user: 2

roles:
  # 寫程式、改 Bug、邏輯推理 —— agent 主腦,必須支援 tool calling
  # 2026-10-06 冒煙測試:Super 每次 0.4–2.6 秒、DeepSeek 18–27 秒 → 日常用 Super,難題再指定 code_deep
  # 2026-10-25:Nemotron 3 Super 在 catalog 上回 404(還列在模型清單裡,但呼叫找不到),備援默默換成 DeepSeek、
  #   每步慢 3–4 倍,依難度選模型的分類器也一直失敗 → 換成 Nemotron 3.5 Super VL(同樣 120B-A12B,也看得懂圖片):
  #   回答、關思考、tool calling 都正常,每次 0.8–1.9 秒;上限 1,000,000 tokens(送超量內容看錯誤訊息得知)
  code:
    model: nvidia/nemotron-3.5-super-vl-120b-a12b
    nim_base_url: http://nim-nemotron-super:8000/v1
    context_window: 131072                  # 模型支援 1M,刻意限制在 128K 控成本與延遲
    max_output: 8192
    # 10/26 實測:成功的呼叫中位數 1.1 秒、最慢 33 秒;免費層偶爾卡住不回,以前要等滿 180 秒才換備援。
    # 串流(網頁、CLI)時這是「多久沒收到東西」,不是整個回答的時間;沒串流的(子 agent、評測)回答都短
    timeout_s: 90
    temperature: 1.0                        # Nemotron 3 模型卡建議值
    top_p: 0.95
    extra_body: {chat_template_kwargs: {force_nonempty_content: true}}  # 模型卡:思考 + tool call 時要加
    thinking_on:  {chat_template_kwargs: {enable_thinking: true}}
    thinking_off: {chat_template_kwargs: {enable_thinking: false}}
    fallbacks: [code_deep]                  # 404 / 429 / 503 / 逾時 → 自動改用下一顆

  # 難題用(跨檔推理、找不到 root cause 時):agent.py --role code_deep,或 routing.difficulty 開 on 自動判斷
  # 2026-10-10 找更快的難題模型:同一題修 bug(demo_workspace)Super 6 步 16 秒、DeepSeek 4 步 136 秒、
  #   GLM-5.3 Flash 4 步 122 秒(第一次 300 秒逾時)→ 沒有明顯比較快,不換;GLM-5.3 冒煙 43–64 秒;
  #   Kimi K3、Laguna XS 逾時;Kimi K2.6、Nemotron Nano 3、Mistral Large 2 已 404
  code_deep:
    model: deepseek-ai/deepseek-v4.1-flash  # DeepSeek 在 catalog 上僅存的版本
    nim_base_url: http://nim-deepseek:8000/v1
    context_window: 131072
    max_output: 8192
    timeout_s: 180
    thinking_on:  {chat_template_kwargs: {thinking: true}}    # V4 系列用 thinking 這個鍵(10/6 實測有效)
    thinking_off: {chat_template_kwargs: {thinking: false}}
    fallbacks: [code]

  # 純生成(補完、單檔重寫、解釋程式碼)。不支援 tool calling,不能當 agent 主腦
  code_writer:
    model: qwen/qwen2.5-coder-32b-instruct
    nim_base_url: http://nim-qwen-coder:8000/v1
    available_on: [nim]                     # catalog 已 EOL
    context_window: 32768                   # 原生 32K;YaRN 可到 128K 但 KV cache 每 token 256 KiB
    max_output: 4096
    supports_tools: false
    temperature: 0.2

  # 大檔案、超長文本、整份技術文件
  long_context:
    model: nvidia/nemotron-3-ultra-550b-a55b
    nim_base_url: http://nim-nemotron-ultra:8000/v1
    # catalog 實際給 1,048,576;設成跟備援(3.5 Super VL,1,000,000)一樣,Ultra 收下的大請求退到備援才放得下
    context_window: 1000000
    nim_context_window: 262144              # 地端預設 256K;要 1M 得另開 vLLM 參數,顯存也要跟著加
    max_output: 16384
    timeout_s: 900                          # 幾十萬 token 的 prefill 可能要好幾分鐘
    temperature: 1.0
    top_p: 0.95
    # 不送 force_nonempty_content:10/6 實測 Ultra 收到它會把推理塞進回答(開頭的 <think> 還被吃掉)
    thinking_on:  {chat_template_kwargs: {enable_thinking: true}}
    thinking_off: {chat_template_kwargs: {enable_thinking: false}}
    fallbacks: [long_context_backup]        # 10/6 實測 Ultra 免費層會間歇回 503 過載

  # Ultra 的備援:3.5 Super VL 在 catalog 上也給 1M(地端要另開 vLLM 參數才有);10/25 從 Nemotron 3 Super 換過來
  long_context_backup:
    model: nvidia/nemotron-3.5-super-vl-120b-a12b
    nim_base_url: http://nim-nemotron-super:8000/v1
    context_window: 1000000
    nim_context_window: 262144              # 不能比 Ultra 小,不然 Ultra 收下的大請求一退到這裡就爆
    max_output: 16384
    timeout_s: 900
    temperature: 1.0
    top_p: 0.95
    extra_body: {chat_template_kwargs: {force_nonempty_content: true}}
    thinking_on:  {chat_template_kwargs: {enable_thinking: true}}
    thinking_off: {chat_template_kwargs: {enable_thinking: false}}

  # 看圖(截圖、圖表、照片):先把圖片轉成文字(圖裡的字逐字抄、畫面重點),主模型拿到的只有文字,工具和路由都照舊。
  # 2026-10-09 實測(錯誤截圖、長條圖、1 MB 的 JPEG):
  #   Nano Omni 關思考 1.4–6.8 秒、300–2,300 tokens,檔名 / 行號 / 數字 / 逐行抄寫全對;開思考 16–38 秒、多 700–1,600 tokens
  #   免費層約一半回 503 忙線,重試 1–3 次通常就過(llm_registry.VISION_RETRIES)
  #   Llama 3.2 90B Vision 把檔名講錯、長條圖逾時;Gemma 4 31B 兩題都逾時(120 秒)
  vision:
    model: nvidia/nemotron-3-nano-omni-30b-a3b-reasoning
    nim_base_url: http://nim-nemotron-omni:8000/v1
    context_window: 65536                   # 一題只有一張圖 + 問題,用不到更長
    max_output: 1024                        # 說明通常 100–200 tokens;偶爾會重複,上限設低一點才不會一直寫下去
    timeout_s: 90
    temperature: 0.2                        # 抄字不需要創意,低一點比較穩
    supports_tools: false
    supports_images: true
    thinking_on:  {chat_template_kwargs: {enable_thinking: true}}
    thinking_off: {chat_template_kwargs: {enable_thinking: false}}
    fallbacks: [vision_backup]

  # 看圖的備援:10/9 實測約 7 秒,長條圖全對,錯誤截圖的行號講錯 → 只在 Nano Omni 一直忙線時用
  vision_backup:
    model: meta/llama-3.2-11b-vision-instruct
    nim_base_url: http://nim-llama-vision:8000/v1
    context_window: 65536
    max_output: 1024
    timeout_s: 90
    temperature: 0.2
    supports_tools: false
    supports_images: true
