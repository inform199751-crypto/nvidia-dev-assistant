<!doctype html>
<html lang="zh-Hant" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#0a0a0a"><!-- 桌面版(Edge app 模式)的標題列顏色 -->
<title>HSUAN</title>
<link rel="icon" href="/favicon.ico">
<!-- 手機「加到主畫面」:圖示和全螢幕(iPhone 看 apple-* 那幾個,Android 看 manifest) -->
<link rel="manifest" href="/manifest.webmanifest">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<meta name="apple-mobile-web-app-title" content="HSUAN">
<script>  /* 外觀(預設深色):在畫面畫出來之前就設好,才不會先閃一下白的 */
  try { document.documentElement.dataset.theme = localStorage.getItem("theme") || "dark"; } catch (e) { /* 不能存就用預設 */ }
</script>
<style>
  /* 版面參考 Claude / ChatGPT 桌面版:左側欄(新增、成品、待命、自訂、更多,下面是專案和對話),中間置中的對話欄。
     外觀:<html data-theme> = dark(預設,黑底)/ light / system(跟著系統);在「更多」切換 */
  :root {
    color-scheme: light;  /* 捲軸等瀏覽器內建元件跟著深淺色 */
    --bg: #ffffff; --sidebar: #f9f9f8; --text: #0d0d0d; --muted: #5d5d5d; --faint: #8f8f8f;
    --line: #e5e5e5; --hover: #ececeb; --active: #e7e6e3; --user: #f4f4f4; --input: #ffffff; --code: #f7f7f8;
    --btn: #0d0d0d; --btn-ink: #ffffff; --btn-off: #d7d7d7; --accent: #10a37f; --accent-ink: #ffffff;
    --dot: #e8a03a; --warn: #c2410c; --error: #d93025; --add: #e7f6ec; --del: #fdecec;
    --shadow: 0 2px 12px rgba(0, 0, 0, .06);
  }
  :root[data-theme="dark"] {
    color-scheme: dark;
    --bg: #121212; --sidebar: #0a0a0a; --text: #ececec; --muted: #b4b4b4; --faint: #858585;
    --line: #2a2a2a; --hover: #1e1e1e; --active: #262626; --user: #242424; --input: #1c1c1c; --code: #0a0a0a;
    --btn: #ffffff; --btn-ink: #0d0d0d; --btn-off: #4a4a4a; --accent: #10a37f; --accent-ink: #ffffff;
    --dot: #f0b45b; --warn: #f59e0b; --error: #f87171; --add: #10291e; --del: #331717;
    --shadow: 0 2px 12px rgba(0, 0, 0, .5);
  }
  @media (prefers-color-scheme: dark) {
    :root[data-theme="system"] {  /* 跟上面深色同一組 */
      color-scheme: dark;
      --bg: #121212; --sidebar: #0a0a0a; --text: #ececec; --muted: #b4b4b4; --faint: #858585;
      --line: #2a2a2a; --hover: #1e1e1e; --active: #262626; --user: #242424; --input: #1c1c1c; --code: #0a0a0a;
      --btn: #ffffff; --btn-ink: #0d0d0d; --btn-off: #4a4a4a; --accent: #10a37f; --accent-ink: #ffffff;
      --dot: #f0b45b; --warn: #f59e0b; --error: #f87171; --add: #10291e; --del: #331717;
      --shadow: 0 2px 12px rgba(0, 0, 0, .5);
    }
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body {
    background: var(--bg); color: var(--text); display: flex; overflow: hidden;
    font: 16px/1.75 ui-sans-serif, system-ui, -apple-system, "Segoe UI", "Microsoft JhengHei", "PingFang TC", "Noto Sans TC", sans-serif;
  }
  button { font: inherit; color: inherit; cursor: pointer; }
  button:disabled { cursor: default; }
  button:focus-visible, textarea:focus-visible, input:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  svg { display: block; flex-shrink: 0; }
  [hidden] { display: none !important; }

  /* ---------- 側邊欄 ---------- */
  aside {
    width: 268px; flex-shrink: 0; background: var(--sidebar); display: flex; flex-direction: column;
    font-size: 14px; line-height: 1.5; border-right: 1px solid var(--line);
  }
  .side-scroll { flex: 1; overflow-y: auto; padding: 8px 8px 12px; }
  .side-top { display: flex; align-items: center; justify-content: space-between; padding: 6px 6px 10px; }
  .brand { display: flex; align-items: center; gap: 8px; font-weight: 600; font-size: 15px; }
  .brand img { width: 22px; height: 22px; border-radius: 6px; box-shadow: 0 0 0 1px var(--line); }  /* 圖示本身是黑的,黑底上要一圈邊才看得到 */
  .nav-btn, .conv {
    display: flex; align-items: center; gap: 10px; width: 100%; text-align: left;
    background: none; border: 0; border-radius: 8px; padding: 6px 8px; color: var(--text);
  }
  .nav-btn:hover:not(:disabled), .conv:hover { background: var(--hover); }
  .nav-btn[aria-current="page"] { background: var(--active); }
  .nav-btn .plus { width: 20px; height: 20px; border-radius: 50%; background: var(--active); display: grid; place-items: center; }
  .nav-btn.more { color: var(--muted); }
  .badge { margin-left: auto; min-width: 18px; height: 18px; border-radius: 9px; background: var(--dot); color: #fff;
           font-size: 11px; font-weight: 600; display: grid; place-items: center; padding: 0 5px; }
  .project { margin-top: 14px; }
  .project-head { display: flex; align-items: center; gap: 2px; padding: 2px 4px 2px 8px; color: var(--muted); font-size: 13px; }
  .project-name { flex: 1; min-width: 0; display: flex; align-items: center; gap: 4px; background: none; border: 0; padding: 2px 0;
                  color: inherit; text-align: left; overflow: hidden; }
  .project-name span { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .project-name svg { transition: transform .15s; }
  .project.collapsed .project-name svg { transform: rotate(-90deg); }
  .project.collapsed .conv-list { display: none; }
  .conv { position: relative; padding-right: 30px; }
  .conv[aria-current="true"] { background: var(--active); }
  .conv .dot { width: 7px; height: 7px; border-radius: 50%; border: 1.5px solid var(--faint); flex-shrink: 0; }
  .conv .dot.on { background: var(--faint); border-color: var(--faint); }
  .conv .dot.busy { background: var(--accent); border-color: var(--accent); animation: pulse 1.2s infinite; }
  .conv .dot.wait { background: var(--dot); border-color: var(--dot); }
  .conv .title { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .conv .menu-btn { position: absolute; right: 4px; top: 50%; transform: translateY(-50%); opacity: 0; }
  .conv:hover .menu-btn, .conv:focus-within .menu-btn { opacity: 1; }
  .empty-proj { color: var(--faint); font-size: 13px; padding: 2px 10px 2px 26px; }
  .add-project { color: var(--muted); margin-top: 10px; font-size: 13px; }
  .side-user { display: flex; align-items: center; gap: 10px; padding: 10px 12px; border-top: 1px solid var(--line); }
  .side-user img { width: 28px; height: 28px; border-radius: 8px; box-shadow: 0 0 0 1px var(--line); }
  .side-user .who { flex: 1; min-width: 0; line-height: 1.3; }
  .side-user .who div { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .side-user .who small { color: var(--faint); font-size: 12px; display: block; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  /* 今天的 token 用量:八成以上變橘、用完變紅 */
  .usage-bar { height: 4px; border-radius: 2px; background: var(--line); margin-top: 4px; overflow: hidden; }
  .usage-bar i { display: block; height: 100%; width: 0; background: var(--accent); }
  .usage-bar.high i { background: var(--warn); }
  .usage-bar.full i { background: var(--error); }
  .usage-big { font-size: 26px; font-weight: 700; }
  .usage-big small { font-size: 14px; font-weight: 400; color: var(--faint); }
  .page .usage-bar { height: 8px; border-radius: 4px; margin: 8px 0 6px; max-width: 420px; }
  .pins { display: flex; gap: 22px; flex-wrap: wrap; }
  .icon-btn { background: none; border: 0; border-radius: 8px; padding: 6px; color: var(--muted); }
  .icon-btn:hover { background: var(--hover); color: var(--text); }
  #close-side, #open-side { display: none; }
  .popup { position: fixed; z-index: 30; background: var(--bg); border: 1px solid var(--line); border-radius: 12px;
           box-shadow: var(--shadow); padding: 4px; min-width: 140px; }
  .popup button { display: block; width: 100%; text-align: left; background: none; border: 0; border-radius: 8px;
                  padding: 6px 10px; font-size: 14px; }
  .popup button:hover { background: var(--hover); }
  .popup button.danger { color: var(--error); }

  /* ---------- 主畫面 ---------- */
  .main { flex: 1; min-width: 0; display: flex; flex-direction: column; }
  .topbar { display: flex; align-items: center; gap: 8px; padding: 10px 16px; min-height: 52px; }
  .model { font-size: 17px; font-weight: 600; display: flex; align-items: baseline; gap: 6px; min-width: 0; }
  .model span { color: var(--faint); font-weight: 400; font-size: 14px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  main { flex: 1; overflow-y: auto; }
  .log { max-width: 768px; margin: 0 auto; padding: 8px 24px 24px; display: flex; flex-direction: column; gap: 22px; }

  /* 新對話:圖示、名稱、一句說明、輸入框、快捷按鈕都放在畫面中間;開始對話後輸入框回到最下面 */
  body.hero .log { min-height: 100%; justify-content: center; }
  body.hero footer { display: none; }  /* 輸入框在中間時,最下面的提示文字也不顯示 */
  .welcome { text-align: center; padding-bottom: 6vh; }
  .welcome .logo { width: 52px; height: 52px; border-radius: 14px; box-shadow: 0 0 0 1px var(--line); }
  .welcome h1 { font-size: 30px; font-weight: 700; margin: 14px 0 4px; letter-spacing: .02em; }
  .welcome .tagline { color: var(--muted); font-size: 15px; margin: 0 0 22px; }
  .welcome .composer { text-align: left; }
  .welcome textarea { min-height: 56px; }
  .chips { display: flex; gap: 10px; justify-content: center; flex-wrap: wrap; margin-top: 16px; }
  .chip { display: inline-flex; align-items: center; gap: 6px; border: 1px solid var(--line); background: transparent;
          border-radius: 999px; padding: 7px 16px; font-size: 14px; color: var(--muted); }
  .chip:hover { background: var(--hover); color: var(--text); }
  .chip.more { width: 36px; height: 36px; padding: 0; justify-content: center; }
  .msg { overflow-wrap: anywhere; }
  .msg.user { align-self: flex-end; max-width: 75%; background: var(--user); border-radius: 22px; padding: 10px 18px; white-space: pre-wrap; }
  .msg.user .mode-tag { display: block; font-size: 12px; color: var(--accent); font-weight: 600; margin-bottom: 2px; }
  .msg.bot > :first-child { margin-top: 0; }
  .msg.bot > :last-child { margin-bottom: 0; }
  .md p, .md ul, .md ol, .md pre, .md table, .md blockquote { margin: 10px 0; }
  .md h2, .md h3, .md h4 { margin: 18px 0 8px; line-height: 1.4; }
  .md h2 { font-size: 20px; } .md h3 { font-size: 18px; } .md h4 { font-size: 16px; }
  .md ul, .md ol { padding-left: 24px; }
  .md li { margin: 3px 0; }
  .md hr { border: 0; border-top: 1px solid var(--line); margin: 18px 0; }
  .md code { background: var(--code); border-radius: 6px; padding: 1px 6px; font: 14px/1.6 ui-monospace, "Cascadia Code", Consolas, monospace; }
  .md pre { background: var(--code); border: 1px solid var(--line); border-radius: 12px; padding: 12px 16px; overflow-x: auto; }
  .md pre code { background: none; padding: 0; }
  .md table { border-collapse: collapse; display: block; overflow-x: auto; font-size: 15px; }
  .md th, .md td { border-bottom: 1px solid var(--line); padding: 6px 12px; text-align: left; vertical-align: top; }
  .md th { font-weight: 600; }
  .md a { color: var(--text); text-decoration: underline; text-decoration-color: var(--faint); }
  .md blockquote { padding-left: 14px; border-left: 3px solid var(--line); color: var(--muted); }

  .tool { font-size: 14px; color: var(--muted); margin: 6px 0; }
  .tool summary { cursor: pointer; display: inline-flex; align-items: center; gap: 6px; max-width: 100%;
                  border-radius: 8px; padding: 2px 8px 2px 4px; list-style: none; }
  .tool summary::-webkit-details-marker { display: none; }
  .tool summary::before { content: "›"; font-size: 16px; width: 12px; text-align: center; transition: transform .15s; }
  .tool[open] summary::before { transform: rotate(90deg); }
  .tool summary:hover { background: var(--hover); color: var(--text); }
  .tool summary span { flex-shrink: 0; }
  .tool summary code { font: 13px ui-monospace, Consolas, monospace; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; min-width: 0; }
  .tool pre { max-height: 280px; overflow: auto; background: var(--code); border: 1px solid var(--line); border-radius: 12px;
              padding: 10px 12px; margin: 6px 0 0; font: 12.5px/1.55 ui-monospace, Consolas, monospace; white-space: pre-wrap; }
  .thinking { color: var(--faint); font-size: 15px; display: flex; align-items: center; gap: 8px; }
  .thinking::before { content: ""; width: 10px; height: 10px; border-radius: 50%; background: var(--text); animation: pulse 1.2s infinite; }
  @keyframes pulse { 0%, 100% { transform: scale(.6); opacity: .4; } 50% { transform: scale(1); opacity: 1; } }
  .notice { color: var(--faint); font-size: 14px; }
  .foot { color: var(--faint); font-size: 13px; margin-top: 8px; }
  .error { color: var(--error); }
  .plan { border: 1px solid var(--line); border-radius: 14px; padding: 10px 14px; margin: 8px 0; font-size: 15px; }
  .plan .title { font-size: 13px; color: var(--faint); margin-bottom: 4px; }
  .plan ol { list-style: none; margin: 0; padding: 0; }
  .plan li { display: flex; gap: 8px; align-items: baseline; padding: 2px 0; }
  .plan li::before { content: "○"; color: var(--faint); width: 16px; flex-shrink: 0; text-align: center; }
  .plan li.in_progress { font-weight: 600; }
  .plan li.in_progress::before { content: "◐"; color: var(--accent); }
  .plan li.done { color: var(--faint); text-decoration: line-through; }
  .plan li.done::before { content: "✓"; color: var(--accent); }

  .card { border: 1px solid var(--line); border-radius: 16px; padding: 14px 16px; background: var(--bg); box-shadow: var(--shadow); }
  .card .q { margin-bottom: 10px; overflow-wrap: anywhere; line-height: 1.6; }
  .tag { display: inline-block; font-size: 12px; font-weight: 600; border-radius: 999px; padding: 1px 8px; margin-right: 6px; vertical-align: 1px; }
  .tag.ok { background: color-mix(in srgb, var(--accent) 16%, transparent); color: var(--accent); }
  .tag.warn { background: color-mix(in srgb, var(--warn) 16%, transparent); color: var(--warn); }
  .card code { background: var(--code); border-radius: 6px; padding: 1px 6px; font: 14px ui-monospace, Consolas, monospace; }
  .actions { display: flex; flex-wrap: wrap; gap: 8px; }
  .pill { border-radius: 999px; padding: 6px 16px; font-size: 14px; font-weight: 500; border: 1px solid var(--line); background: var(--bg); }
  .pill:hover:not(:disabled) { background: var(--hover); }
  .pill.primary { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
  .pill.primary:hover:not(:disabled) { background: color-mix(in srgb, var(--accent) 85%, black); }
  .pill.dark { background: var(--btn); border-color: var(--btn); color: var(--btn-ink); }
  .pill:disabled { opacity: .5; }
  .card .result { color: var(--muted); font-size: 14px; }
  .diff { max-height: 320px; overflow: auto; background: var(--code); border: 1px solid var(--line); border-radius: 12px; margin: 0 0 12px;
          font: 12.5px/1.6 ui-monospace, Consolas, monospace; padding: 6px 0; }
  .diff div { padding: 0 12px; white-space: pre; }
  .diff .add { background: var(--add); }
  .diff .del { background: var(--del); }

  /* ---------- 側邊欄打開的頁面:成品 / 待命 / 自訂 / 更多 ---------- */
  .page { flex: 1; overflow-y: auto; }
  .page-in { max-width: 768px; margin: 0 auto; padding: 8px 24px 40px; }
  .page h2 { font-size: 24px; margin: 4px 0 4px; }
  .page .lead { color: var(--faint); margin: 0 0 20px; font-size: 14px; }
  .page h3 { font-size: 15px; margin: 26px 0 8px; color: var(--muted); font-weight: 600; }
  .rows { border: 1px solid var(--line); border-radius: 14px; overflow: hidden; }
  .row { display: flex; align-items: center; gap: 12px; padding: 10px 14px; border-top: 1px solid var(--line); }
  .row:first-child { border-top: 0; }
  .row .grow { flex: 1; min-width: 0; }
  .row .name { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .row small { color: var(--faint); display: block; font-size: 12.5px; }
  .row .actions { flex-shrink: 0; }
  .none { color: var(--faint); font-size: 14px; padding: 14px; border: 1px dashed var(--line); border-radius: 14px; text-align: center; }
  .page pre.rules { background: var(--code); border: 1px solid var(--line); border-radius: 12px; padding: 12px 14px;
                    white-space: pre-wrap; font: 13px/1.6 ui-monospace, Consolas, monospace; max-height: 320px; overflow: auto; }
  .field { display: flex; gap: 8px; margin-top: 10px; }
  .field input { flex: 1; min-width: 0; font: inherit; font-size: 14px; padding: 7px 12px; border: 1px solid var(--line);
                 border-radius: 10px; background: var(--bg); color: var(--text); }
  .kv { display: grid; grid-template-columns: 120px 1fr; gap: 6px 12px; font-size: 14px; }
  .kv dt { color: var(--faint); }
  .kv dd { margin: 0; overflow-wrap: anywhere; }
  .help li { margin: 4px 0; font-size: 14px; }
  .phone { display: flex; gap: 18px; align-items: center; border: 1px solid var(--line); border-radius: 14px; padding: 14px; margin-bottom: 8px; }
  .phone .qr { width: 168px; flex-shrink: 0; border-radius: 10px; overflow: hidden; }
  .phone .qr svg { width: 100%; height: auto; }
  .phone .grow { flex: 1; min-width: 0; }
  .phone .pin-label { color: var(--faint); font-size: 13px; }
  .phone .pin { font: 600 32px/1.2 ui-monospace, Consolas, monospace; letter-spacing: .15em; }
  .phone .url { font: 14px/1.5 ui-monospace, Consolas, monospace; margin: 6px 0; overflow-wrap: anywhere; }
  .phone small { display: block; color: var(--faint); font-size: 12.5px; }

  /* ---------- 輸入框 ---------- */
  footer { padding: 0 16px 14px; }
  /* 兩層:上面打字;下面左邊附加檔案、先規劃,右邊選模型、送出 */
  .composer { max-width: 768px; margin: 0 auto; display: flex; flex-direction: column; gap: 6px; background: var(--input);
              border: 1px solid var(--line); border-radius: 22px; padding: 12px 10px 10px 14px; box-shadow: var(--shadow); }
  textarea { width: 100%; resize: none; border: 0; outline: none; background: transparent; color: var(--text);
             font: inherit; line-height: 1.6; padding: 2px 2px; max-height: 200px; min-height: 28px; }
  .composer-bar { display: flex; align-items: center; gap: 6px; }
  .composer-bar .spacer { flex: 1; }
  .model-pick { display: inline-flex; align-items: center; gap: 4px; background: none; border: 0; border-radius: 8px;
                padding: 4px 8px; font-size: 14px; font-weight: 600; color: var(--text); max-width: 46vw; }
  .model-pick span { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .model-pick:hover { background: var(--hover); }
  .popup button small { display: block; color: var(--faint); font-size: 12px; }
  textarea::placeholder { color: var(--faint); }
  .mode-btn { flex-shrink: 0; align-self: center; display: inline-flex; align-items: center; gap: 4px; border: 1px solid var(--line);
              background: transparent; border-radius: 999px; padding: 4px 12px 4px 9px; font-size: 13px; color: var(--muted); }
  .mode-btn:hover { background: var(--hover); color: var(--text); }
  .mode-btn[aria-pressed="true"] { border-color: var(--accent); color: var(--accent); background: color-mix(in srgb, var(--accent) 10%, transparent); }
  .round-btn { flex-shrink: 0; align-self: center; width: 32px; height: 32px; border-radius: 50%; border: 0; background: transparent;
               color: var(--muted); display: grid; place-items: center; }
  .round-btn:hover { background: var(--hover); color: var(--text); }
  .send { width: 36px; height: 36px; border-radius: 50%; border: 0; flex-shrink: 0; background: var(--btn); color: var(--btn-ink);
          display: grid; place-items: center; }
  .send:disabled { background: var(--btn-off); }
  .send.busy svg { animation: spin 1s linear infinite; }
  @keyframes spin { to { transform: rotate(360deg); } }
  .hint { max-width: 768px; margin: 8px auto 0; text-align: center; color: var(--faint); font-size: 12px; }

  /* ---------- 手機:側邊欄改成抽屜 ---------- */
  .scrim { display: none; }
  @media (max-width: 768px) {
    aside { position: fixed; inset: 0 auto 0 0; z-index: 20; transform: translateX(-100%); transition: transform .2s; box-shadow: var(--shadow); }
    body.side-open aside { transform: none; }
    body.side-open .scrim { display: block; position: fixed; inset: 0; z-index: 10; background: rgba(0, 0, 0, .35); }
    #close-side, #open-side { display: block; }
    .log, .page-in { padding-left: 16px; padding-right: 16px; }
    .msg.user { max-width: 88%; }
    .welcome h1 { font-size: 26px; }
    .chip { padding: 6px 12px; font-size: 13px; }
    .kv { grid-template-columns: 1fr; }
    .phone { flex-direction: column; align-items: flex-start; }
    .conv .menu-btn { opacity: 1; }
  }
</style>
</head>
<body>
<aside id="sidebar" aria-label="側邊欄">
  <div class="side-scroll">

<div class="scrim" id="scrim"></div>

<div class="main">
  <div class="topbar">
    <button type="button" class="icon-btn" id="open-side" aria-label="打開側邊欄">
      <svg width="22" height="22" viewBox="0 0 22 22" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M4 6h14M4 11h14M4 16h9"/></svg>

  </main>
  <section class="page" id="page" hidden><div class="page-in" id="page-in"></div></section>
  <footer id="composer-area">
    <form id="form" class="composer">
      <textarea id="input" rows="1" placeholder="請輸入訊息…" aria-label="輸入問題"></textarea>
      <div class="composer-bar">
        <button type="button" class="round-btn" id="attach" aria-label="附加專案裡的檔案" title="附加專案裡的檔案(輸入 @檔名)">
          <svg width="18" height="18" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round"><path d="M10 4v12M4 10h12"/></svg>
        </button>
        <button type="button" class="mode-btn" id="plan-mode" aria-pressed="false" title="開啟後,HSUAN 先只讀不改、交出計畫,你同意才照計畫做">
          <svg width="14" height="14" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M7 5h10M7 10h10M7 15h10M3 5h.01M3 10h.01M3 15h.01"/></svg>
          先規劃
        </button>
        <span class="spacer"></span>
        <button type="button" class="model-pick" id="model-pick" aria-label="選擇模型" title="選擇這段對話用的模型">
          <span id="model-name">自動</span>
          <svg width="12" height="12" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 8l5 5 5-5"/></svg>
        </button>
        <button type="submit" class="send" id="send" aria-label="送出" disabled>
          <svg width="18" height="18" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M10 16V4M5 9l5-5 5 5"/></svg>
        </button>
      </div>
    </form>
    <div class="hint">用 @檔名 附上專案裡的檔案 · Enter 送出、Shift+Enter 換行 · HSUAN 也會出錯,重要的結果請自己確認</div>
  </footer>
</div>
<script>
const TOKEN = "__TOKEN__";
const $ = (id) => document.getElementById(id);
const log = $("log"), input = $("input"), send = $("send");
let bot = null;           // 目前這一輪的回答區塊
let busy = false;
const tools = [];         // 依序等結果的工具區塊
let cards = {};           // 確認 / 套用卡片:id → 元素
let conv = null;          // 目前這段對話的 id
let desk = { projects: [], conversations: [] };
let state = {};           // /api/state(這段對話的狀態)
let es = null;            // 事件串流
let page = null;          // 打開中的側邊欄頁面
const SEND_ICON = send.innerHTML;
const BUSY_ICON = '<svg width="18" height="18" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M10 3a7 7 0 107 7"/></svg>';
const store = {
  get: (k, d) => { try { return localStorage.getItem(k) ?? d; } catch (e) { return d; } },
  set: (k, v) => { try { localStorage.setItem(k, v); } catch (e) { /* 無痕視窗等不能存,沒關係 */ } },
};

const theme = () => document.documentElement.dataset.theme || "dark";
function setTheme(t) {
  document.documentElement.dataset.theme = t; store.set("theme", t);
  const dark = t === "dark" || (t === "system" && matchMedia("(prefers-color-scheme: dark)").matches);
  document.querySelector('meta[name="theme-color"]').content = dark ? "#0a0a0a" : "#f9f9f8";
}

function api(path, body, convId) {
  return fetch(path, {
    method: body === undefined ? "GET" : "POST",
    headers: { "X-Token": TOKEN, "Content-Type": "application/json", "X-Conv": convId || conv || "" },
    body: body === undefined ? undefined : JSON.stringify(body),
  }).then(async (r) => ({ ok: r.ok, status: r.status, data: await r.json().catch(() => ({})) }));
}
const download = (url) => { location.href = url; };

// ---------- 迷你 markdown(先跳脫 HTML,只轉常用語法) ----------
const esc = (s) => s.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;");
function inline(s) {
  return esc(s)
    .replace(/`([^`]+)`/g, "<code>$1</code>")
    .replace(/\*\*([^*]+)\*\*/g, "<strong>$1</strong>")
    .replace(/\[([^\]]+)\]\((https?:\/\/[^)\s]+)\)/g, '<a href="$2" target="_blank" rel="noopener noreferrer">$1</a>')
    .replace(/(^|[\s(（])(https?:\/\/[^\s<)）]+)/g, '$1<a href="$2" target="_blank" rel="noopener noreferrer">$2</a>')
    .replace(/&lt;br\s*\/?&gt;/g, "<br>");
}
const isTableRow = (l) => /^\s*\|.*\|\s*$/.test(l);
const isSep = (l) => /^\s*\|?\s*:?-{2,}:?\s*(\|\s*:?-{2,}:?\s*)*\|?\s*$/.test(l);
const isList = (l) => /^\s*([-*]|\d+\.)\s+/.test(l);
function table(rows) {
  const cells = (r) => r.trim().replace(/^\|/, "").replace(/\|$/, "").split("|").map((c) => inline(c.trim()));
  const body = rows.filter((r) => !isSep(r));
  const head = cells(body.shift() || "");
  return "<table><thead><tr>" + head.map((c) => `<th>${c}</th>`).join("") + "</tr></thead><tbody>" +
    body.map((r) => "<tr>" + cells(r).map((c) => `<td>${c}</td>`).join("") + "</tr>").join("") + "</tbody></table>";
}
function md(src) {
  const lines = src.replace(/\r/g, "").split("\n"), out = [];
  let i = 0;
  while (i < lines.length) {
    const l = lines[i];
    let m;
    if (/^\s*```/.test(l)) {
      const buf = []; i++;
      while (i < lines.length && !/^\s*```/.test(lines[i])) buf.push(lines[i++]);
      // 結束那行如果帶語言(```diff),其實是下一個區塊的開頭:模型漏寫了結尾(10/9 實測寫成「\]」),
      // 吃掉它的話後面整篇的程式碼框都會錯位
      if (i < lines.length && /^\s*```\s*$/.test(lines[i])) i++;
      out.push("<pre><code>" + esc(buf.join("\n")) + "</code></pre>");
    } else if (isTableRow(l)) {
      const rows = []; while (i < lines.length && isTableRow(lines[i])) rows.push(lines[i++]);
      out.push(table(rows));
    } else if ((m = l.match(/^(#{1,6})\s+(.*)/))) {
      const n = Math.min(m[1].length + 1, 4); out.push(`<h${n}>${inline(m[2])}</h${n}>`); i++;
    } else if (isList(l)) {
      const ordered = /^\s*\d+\./.test(l), items = [];
      while (i < lines.length && isList(lines[i])) items.push("<li>" + inline(lines[i++].replace(/^\s*([-*]|\d+\.)\s+/, "")) + "</li>");
      out.push(ordered ? `<ol>${items.join("")}</ol>` : `<ul>${items.join("")}</ul>`);
    } else if (/^\s*(---+|\*\*\*+)\s*$/.test(l)) {
      out.push("<hr>"); i++;
    } else if (/^>\s?/.test(l)) {
      const buf = []; while (i < lines.length && /^>\s?/.test(lines[i])) buf.push(lines[i++].replace(/^>\s?/, ""));
      out.push("<blockquote>" + buf.map(inline).join("<br>") + "</blockquote>");
    } else if (!l.trim()) {
      i++;
    } else {
      const buf = [];
      do { buf.push(lines[i++]); }  // 至少吃一行,避免卡住
      while (i < lines.length && lines[i].trim() && !/^\s*(```|#{1,6}\s|>|---)/.test(lines[i]) && !isTableRow(lines[i]) && !isList(lines[i]));
      out.push("<p>" + buf.map(inline).join("<br>") + "</p>");
    }
  }
  return out.join("");
}

// ---------- 小工具 ----------
const nearBottom = () => { const s = $("scroller"); return s.scrollHeight - s.scrollTop - s.clientHeight < 80; };
function el(tag, cls, text) {
  const e = document.createElement(tag);
  if (cls) e.className = cls;
  if (text !== undefined) e.textContent = text;
  return e;
}
function button(label, cls, onclick) {
  const b = el("button", cls, label); b.type = "button"; b.onclick = onclick; return b;
}
function add(node) {
  dock();
  const stick = nearBottom();
  log.appendChild(node);
  if (stick) node.scrollIntoView({ block: "end" });
  return node;
}
const fmtSize = (n) => n < 1024 ? `${n} B` : n < 1048576 ? `${(n / 1024).toFixed(1)} KB` : `${(n / 1048576).toFixed(1)} MB`;
const fmtTime = (t) => new Date(t * 1000).toLocaleString("zh-TW", { month: "numeric", day: "numeric", hour: "2-digit", minute: "2-digit" });
let timers = {};
const later = (key, fn, ms = 300) => { clearTimeout(timers[key]); timers[key] = setTimeout(fn, ms); };

// ---------- 新對話的畫面:圖示、名稱、一句說明、輸入框、快捷按鈕都在中間 ----------
const form = $("form");
const icon = (d) => `<svg width="15" height="15" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round">${d}</svg>`;
// [名稱, 圖示, 填進輸入框的開頭(不直接送出,讓你補完), 要不要開「先規劃」]
const CHIPS = [
  ["找 bug", icon('<path d="M7 6l-4 4 4 4M13 6l4 4-4 4"/>'), "幫我找出這個錯誤的原因並修正:"],
  ["解釋程式", icon('<path d="M3 4.5h5a2 2 0 012 2V16a1.5 1.5 0 00-1.5-1.5H3zM17 4.5h-5a2 2 0 00-2 2V16a1.5 1.5 0 011.5-1.5H17z"/>'), "解釋 @"],
  ["寫文件", icon('<path d="M13.5 3.5l3 3L7 16H4v-3z"/>'), "幫我寫一份文件:"],
  ["整理摘要", icon('<path d="M7 5h10M7 10h10M7 15h7M3 5h.01M3 10h.01M3 15h.01"/>'), "把下面的內容整理成重點摘要:\n"],
];
const MORE_CHIPS = [["上網查資料", "", "上網查:"], ["讀辦公檔案", "", "摘要 @"], ["先規劃再動手", "", "", true]];
function useChip([, , text, plan]) {
  if (plan) setPlanMode(true);
  input.value = text; autosize(); updateSend(); input.focus();
  input.setSelectionRange(text.length, text.length);
}
function showEmpty() {
  log.innerHTML = "";
  document.body.classList.add("hero");
  const box = el("div", "welcome");
  const logo = box.appendChild(el("img", "logo"));
  logo.src = "/icon-192.png"; logo.alt = "";
  box.appendChild(el("h1", "", "HSUAN"));
  box.appendChild(el("p", "tagline", "你的 AI 研發助理:寫程式、整理文件、上網查資料。"));
  box.appendChild(form);  // 輸入框搬到中間;開始對話時 dock() 搬回最下面
  const chips = box.appendChild(el("div", "chips"));
  for (const c of CHIPS) {
    const b = chips.appendChild(button("", "chip", () => useChip(c)));
    b.innerHTML = c[1]; b.append(c[0]);
  }
  const more = chips.appendChild(button("", "chip more", () => popup(more, MORE_CHIPS.map((c) => [c[0], () => useChip(c)]))));
  more.innerHTML = icon('<path d="M10 4v12M4 10h12"/>');
  more.setAttribute("aria-label", "更多"); more.title = "更多";
  log.appendChild(box);
  setBusy(busy);
}
function dock() {  // 開始對話:輸入框回到最下面
  if (!document.body.classList.contains("hero")) return;
  document.body.classList.remove("hero");
  $("composer-area").prepend(form);
  log.querySelector(".welcome")?.remove();
}

// ---------- 送出 / 狀態 ----------
function updateSend() { send.disabled = busy || !input.value.trim(); }
function setBusy(b) {
  busy = b;
  send.classList.toggle("busy", b);
  send.innerHTML = b ? BUSY_ICON : SEND_ICON;
  send.setAttribute("aria-label", b ? "回答中" : "送出");
  updateSend();
}
function ensureBot() {
  if (!bot) { bot = add(el("div", "msg bot")); bot.textEl = null; bot.thinkEl = null; }
  return bot;
}
function stopThinking() { if (bot && bot.thinkEl) { bot.thinkEl.remove(); bot.thinkEl = null; } }

// 文字片段很密,合併到下一個畫面更新再重繪。記住「要重繪哪個元素」而不是看目前的 bot:
// 這一輪的 done 可能比畫面更新早到,那時 bot 已經清掉,最後一段就會沒畫出來(10/9 實測踩到)
const dirty = new Set();
let pending = false;
function renderText(target) {
  dirty.add(target);
  if (pending) return;
  pending = true;
  requestAnimationFrame(flush);
}
function flush() {  // 背景分頁不跑 requestAnimationFrame,所以一輪結束時也直接呼叫,保證畫完
  pending = false;
  const stick = nearBottom();
  for (const t of dirty) t.innerHTML = md(t.raw);
  dirty.clear();
  if (stick) $("scroller").scrollTop = $("scroller").scrollHeight;
}
function diffView(text) {
  const box = el("div", "diff");
  for (const line of text.split("\n")) {
    const cls = line.startsWith("+") && !line.startsWith("+++") ? "add" : line.startsWith("-") && !line.startsWith("---") ? "del" : "";
    box.appendChild(el("div", cls, line || " "));
  }
  return box;
}
function cardButtons(card, specs) {
  const actions = card.appendChild(el("div", "actions"));
  for (const [label, cls, onclick] of specs) {
    const b = actions.appendChild(button(label, "pill " + cls, async () => {
      actions.querySelectorAll("button").forEach((x) => (x.disabled = true));
      if ((await onclick()) === false) actions.querySelectorAll("button").forEach((x) => (x.disabled = false));
    }));
  }
  return actions;
}
function renderPlan(box, steps) {
  box.innerHTML = "";
  box.appendChild(el("div", "title", "計畫進度"));
  const list = box.appendChild(el("ol"));
  for (const s of steps) list.appendChild(el("li", ["pending", "in_progress", "done"].includes(s.status) ? s.status : "pending", s.step || ""));
}
const refreshSoon = () => { later("desk", loadDesk); later("pending", loadPending); later("state", loadState); };

// ---------- 事件 ----------
const handlers = {
  user(e) {
    bot = null; tools.length = 0;
    const m = el("div", "msg user");
    if (e.mode === "plan") m.appendChild(el("span", "mode-tag", "先規劃"));
    m.append(e.text);
    add(m).scrollIntoView({ block: "end" }); setBusy(true); refreshSoon();
  },
  thinking() { const b = ensureBot(); if (!b.thinkEl) b.thinkEl = b.appendChild(el("div", "thinking", "思考中")); },
  text(e) {
    const b = ensureBot(); stopThinking();
    if (!b.textEl) { b.textEl = b.appendChild(el("div", "md")); b.textEl.raw = ""; }
    b.textEl.raw += e.text; renderText(b.textEl);
  },
  tool(e) {
    const b = ensureBot(); stopThinking(); b.textEl = null;  // 工具後面的文字另起一段
    const d = b.appendChild(el("details", "tool"));
    const summary = d.appendChild(el("summary"));
    const args = JSON.stringify(e.args);
    summary.append(el("span", "", e.name), el("code", "", args.length > 100 ? args.slice(0, 100) + "…" : args));
    d.out = d.appendChild(el("pre", "", "執行中…"));
    tools.push(d);
  },
  tool_done(e) { const d = tools.shift(); if (d) d.out.textContent = e.output; },
  step() { stopThinking(); },
  notice(e) { ensureBot().appendChild(el("div", "notice", e.text)); },
  plan(e) {  // 照計畫執行時的進度清單:同一輪只有一份,每次更新就重畫
    const b = ensureBot(); stopThinking(); b.textEl = null;
    if (!b.planEl) b.planEl = b.appendChild(el("div", "plan"));
    renderPlan(b.planEl, e.steps || []);
  },
  done(e) {
    stopThinking(); flush();
    const b = ensureBot();
    if (!b.querySelector(".md")) { const t = b.appendChild(el("div", "md")); t.innerHTML = md(e.answer || ""); }
    b.appendChild(el("div", "foot", `${e.role} · ${e.steps} 步 · ${e.tokens.toLocaleString()} tokens(這段對話累計 ${e.total.toLocaleString()})`));
    bot = null; setBusy(false); refreshSoon();
  },
  error(e) { stopThinking(); flush(); ensureBot().appendChild(el("div", "error", `錯誤:${e.text}`)); bot = null; setBusy(false); refreshSoon(); },
  confirm(e) {
    stopThinking();
    const card = add(el("div", "card"));
    const q = card.appendChild(el("div", "q"));
    q.append(el("span", "tag warn", "需要你同意"), `HSUAN 想要${e.action}:`, el("code", "", e.detail));
    cardButtons(card, [
      ["允許這次", "primary", () => api("/api/confirm", { id: e.id, answer: "y" })],
      ["之後都允許", "", () => api("/api/confirm", { id: e.id, answer: "a" })],
      ["不要", "", () => api("/api/confirm", { id: e.id, answer: "n" })],
    ]);
    cards[e.id] = card; bot = null; refreshSoon();
    card.scrollIntoView({ block: "end", behavior: "smooth" });  // 要使用者按按鈕的卡片一定要看得到
  },
  confirm_done(e) {
    refreshSoon();
    const card = cards[e.id]; if (!card) return;
    card.querySelector(".actions")?.remove();
    card.appendChild(el("div", "result", { y: "✓ 已允許這次", a: "✓ 已允許(之後同類動作不再問)", n: "✗ 沒有允許" }[e.answer] || ""));
  },
  offer_plan() {
    const card = add(el("div", "card"));
    const q = card.appendChild(el("div", "q"));

    };

};
const patchUrl = (c, i) => `/api/patch?token=${encodeURIComponent(TOKEN)}&c=${encodeURIComponent(c)}&i=${i}`;

let checkedAt = 0;
function connect() {
  if (es) es.close();
  const mine = conv;
  es = new EventSource(`/api/events?token=${encodeURIComponent(TOKEN)}&c=${encodeURIComponent(conv)}`);
  es.onmessage = (m) => {
    if (mine !== conv) return;  // 已經切到別段對話了
    const e = JSON.parse(m.data); (handlers[e.kind] || (() => {}))(e);
  };
  // 伺服器重啟後 token 會換,舊頁面會一直用舊 token 重連、畫面默默卡住:確認是 403 就重新載入拿新的
  es.onerror = async () => {
    if (Date.now() - checkedAt < 5000) return;
    checkedAt = Date.now();
    try { if ((await api("/api/state")).status === 403) location.reload(); } catch (e) { /* 伺服器還沒起來,等下次 */ }
  };
}

function popup(anchor, items) {

    if (Array.isArray(label)) b.appendChild(el("small", "", label[1]));
  }
  document.body.appendChild(box);
  const r = anchor.getBoundingClientRect();
  box.style.left = Math.min(r.left, innerWidth - box.offsetWidth - 8) + "px";
  box.style.top = Math.min(r.bottom + 4, innerHeight - box.offsetHeight - 8) + "px";
  setTimeout(() => document.addEventListener("click", function off(ev) {

  bar.classList.toggle("high", ratio >= 0.8 && ratio < 1);

}

    box.appendChild(el("p", "lead", "每段對話開始時 HSUAN 都會先讀,例如「回答都要附檔案路徑」、「測試用 pytest」。"));
    if (r.data.downloaded) box.appendChild(el("p", "lead",
      "這是從 GitHub 下載的專案:它自帶的 ASSISTANT.md 是別人寫的,HSUAN 不會照著做;你在這裡加的規則另外存在 HSUAN 自己的資料夾。"));
    if (r.data.text) box.appendChild(el("pre", "rules", r.data.text)); else box.appendChild(el("div", "none", "這個專案還沒有規則。"));
    if (r.data.team) box.appendChild(el("p", "lead", state.guest ? "訪客不能改專案規則。" : "多人模式的專案規則由管理者維護。"));
    else {
      const f = box.appendChild(el("div", "field"));
      const inp = f.appendChild(el("input")); inp.placeholder = "新增一條規則,例如:回答都要附檔案路徑";
      const go = async () => {
        if (!inp.value.trim()) return;
        const x = await api("/api/remember", { rule: inp.value });
        if (!x.ok) return alert(x.data.error || "新增失敗");
        renderPage();
      };
      inp.onkeydown = (ev) => { if (ev.key === "Enter" && !ev.isComposing) go(); };
      f.appendChild(button("加入", "pill dark", go));
    }
  } else if (name === "settings") {
    section(box, "今天的用量");
    if (state.usage) {
      const { used, limit } = state.usage;
      const big = box.appendChild(el("div", "usage-big", fmtTok(used)));
      big.appendChild(el("small", "", ` / ${fmtTok(limit)} tokens(${Math.min(100, used / limit * 100).toFixed(1)}%)`));
      const bar = box.appendChild(el("div", "usage-bar"));
      paintBar(bar, used, limit);
      box.appendChild(el("p", "lead", (state.guest ? "這是訪客自己的額度。" : "")
        + "每天台灣時間午夜重算;用完當天就不能再問。每題回答下面也會寫這一題用了多少。"));
    } else box.appendChild(el("p", "lead", "這裡沒有用量資料。"));
    section(box, "外觀");
    const look = box.appendChild(el("div", "actions"));
    for (const [t, label] of [["dark", "深色"], ["light", "淺色"], ["system", "跟著系統"]])
      look.appendChild(button(label, "pill" + (theme() === t ? " dark" : ""), () => { setTheme(t); renderPage(); }));
    if (r.ok) renderPhone(box, r.data);  // 只有桌面版、而且是電腦自己看才有(手機上看不到 PIN)
    section(box, "模型");
    box.appendChild(el("p", "lead", `預設 ${state.model || ""}。每段對話可以在輸入框右下角換模型;要改有哪些模型,改 models.yaml。`));
    section(box, "上網");
    box.appendChild(el("p", "lead", `${state.status || ""}。要開關請改專案資料夾 .env 的 ALLOW_WEB(true / false),改完重新打開 HSUAN。`));
  } else if (name === "more") {
    section(box, "這段對話");
    const a = box.appendChild(el("div", "actions"));
    a.appendChild(button("整理對話(摘要前面的內容,省 token)", "pill", async () => {
      const x = await api("/api/compact", {});
      alert(x.data.text || "已整理,摘要會出現在對話裡");
      closePage();
    }));
    section(box, "目前狀態");
    const dl = box.appendChild(el("dl", "kv"));
    const kv = (k, v) => { dl.appendChild(el("dt", "", k)); dl.appendChild(el("dd", "", v)); };
    kv("專案資料夾", state.workspace || "");
    kv("上網", state.status || "");
    kv("專案規則", state.instructions ? "已讀取 ASSISTANT.md" : "沒有 ASSISTANT.md");
    kv("草稿", state.draft?.length ? `${state.draft.length} 個檔案還沒套用:${state.draft.join("、")}` : "沒有");
    kv("模型", state.model || "");
    if (state.user) kv("登入", state.user);
    if (state.lan) { kv("手機開", state.lan.urls.join("、")); kv("手機 PIN", state.lan.pin); }
    section(box, "使用說明");
    const ul = box.appendChild(el("ul", "help"));
    for (const t of [
      "用 @檔名 附上專案裡的檔案,例如:解釋 @calc.py。",
      "修改先放在 HSUAN 的草稿上,你按「套用到專案」才會真的改檔案;還沒套用的會出現在「待命」。",
      "大任務打開「先規劃」:HSUAN 先只讀不改、交出計畫,你同意才照計畫做。",
      "上網前一定會先問你;公司內網和本機網址一律不准。",
      "左邊每個專案是一個資料夾,底下是它的對話;「新增專案」可以加你自己的資料夾。",
      "對話會自動存檔,關掉再打開還在。",
    ]) ul.appendChild(el("li", "", t));
  }
}

// ---------- 規劃模式、送出 ----------
let planMode = false;
function setPlanMode(on) {
  planMode = on;
  $("plan-mode").setAttribute("aria-pressed", String(on));
  input.placeholder = on ? "要規劃什麼任務?" : "請輸入訊息…";
}
// 輸入框的「+」:插入 @,接著打專案裡的檔名(問題裡的 @檔名 會自動附上那個檔案)
$("attach").onclick = () => {
  const at = input.selectionStart ?? input.value.length;
  const before = input.value.slice(0, at), sep = before && !/\s$/.test(before) ? " " : "";
  input.value = before + sep + "@" + input.value.slice(at);
  autosize(); updateSend(); input.focus();
  input.setSelectionRange(before.length + sep.length + 1, before.length + sep.length + 1);
};
// 輸入框的「選模型」:這段對話之後都用它;自動 = 依難度和長度選
function renderModel() {
  const cur = (state.roles || []).find((r) => r.role === (state.role ?? null));
  $("model-name").textContent = cur ? cur.name : "自動";
}
$("model-pick").onclick = () => popup($("model-pick"), (state.roles || []).map((r) => [
  [(r.role === (state.role ?? null) ? "✓ " : "") + r.name, r.desc], async () => {
    const x = await api("/api/role", { role: r.role });
    if (!x.ok) return alert(x.data.error || "換模型失敗");
    state.role = x.data.role; renderModel();
  }]));
$("plan-mode").onclick = () => { setPlanMode(!planMode); input.focus(); };
async function submit() {
  const text = input.value.trim();
  if (!text || busy || !conv) return;
  const mode = planMode ? "plan" : "normal";
  input.value = ""; autosize(); updateSend(); setPlanMode(false);
  const r = await api("/api/ask", { text, mode });
  if (!r.ok) { alert(r.data.error || "送出失敗"); input.value = text; autosize(); updateSend(); setPlanMode(mode === "plan"); }
}
$("form").onsubmit = (ev) => { ev.preventDefault(); submit(); };
input.addEventListener("keydown", (ev) => {
  if (ev.key === "Enter" && !ev.shiftKey && !ev.isComposing) { ev.preventDefault(); submit(); }
});
function autosize() {  // 空的時候回到一行:提示文字換行時 scrollHeight 也會變高,不能拿來算
  input.style.height = "auto";
  if (input.value) input.style.height = Math.min(input.scrollHeight, 200) + "px";
}
input.addEventListener("input", () => { autosize(); updateSend(); });
const closeSide = () => document.body.classList.remove("side-open");
$("open-side").onclick = () => document.body.classList.add("side-open");
$("close-side").onclick = closeSide;
$("scrim").onclick = closeSide;

setTheme(theme());
matchMedia("(prefers-color-scheme: dark)").addEventListener("change", () => setTheme(theme()));  // 跟著系統時,系統切換也跟著變
loadDesk();
loadPending();
setInterval(() => {  // 別段對話在背景跑完、有事等你,側邊欄也會更新;「更多」開著時更新配對的手機數
  loadDesk(); loadPending();
  if (page === "settings") renderPage();  // 配對的手機數、用量
}, 10000);
</script>
</body>
</html>
