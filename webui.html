<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>小助理</title>
<style>
  :root {
    --bg: #f7f6f3; --panel: #ffffff; --text: #1f2328; --muted: #6b6f76; --line: #e3e1dc;
    --accent: #76b900; --accent-ink: #ffffff; --user: #eef3e4; --code: #f2f1ed;
    --warn: #b45309; --error: #b42318; --add: #e6f4ea; --del: #fdecea;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #17181a; --panel: #1f2023; --text: #e8e6e3; --muted: #9a9ca1; --line: #2e3034;
      --accent: #8ccf1f; --accent-ink: #10130b; --user: #26301a; --code: #2a2b2f;
      --warn: #f0a44b; --error: #f97066; --add: #1f3324; --del: #3a2020;
    }
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body {
    background: var(--bg); color: var(--text);
    font: 15px/1.6 system-ui, "Microsoft JhengHei", "PingFang TC", "Noto Sans TC", sans-serif;
    display: flex; flex-direction: column;
  }
  header {
    display: flex; flex-wrap: wrap; align-items: center; gap: 8px 12px;
    padding: 10px 16px; border-bottom: 1px solid var(--line); background: var(--panel);
  }
  header h1 { font-size: 16px; margin: 0; font-weight: 600; }
  .chips { display: flex; flex-wrap: wrap; gap: 6px; flex: 1; min-width: 0; }
  .chip {
    font-size: 12px; color: var(--muted); border: 1px solid var(--line); border-radius: 999px;
    padding: 1px 8px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 100%;
  }
  button {
    font: inherit; font-size: 13px; border: 1px solid var(--line); background: var(--panel); color: var(--text);
    border-radius: 8px; padding: 5px 12px; cursor: pointer;
  }
  button:hover:not(:disabled) { border-color: var(--muted); }
  button:disabled { opacity: .5; cursor: default; }
  button.primary { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); font-weight: 600; }
  main { flex: 1; overflow-y: auto; padding: 16px; }
  .log { max-width: 820px; margin: 0 auto; display: flex; flex-direction: column; gap: 14px; }
  .empty { color: var(--muted); text-align: center; margin-top: 12vh; }
  .empty p { margin: 4px 0; }
  .msg { border-radius: 12px; padding: 10px 14px; overflow-wrap: anywhere; }
  .msg.user { background: var(--user); align-self: flex-end; max-width: 85%; white-space: pre-wrap; }
  .msg.bot { background: var(--panel); border: 1px solid var(--line); }
  .msg.bot > :first-child { margin-top: 0; }
  .msg.bot > :last-child { margin-bottom: 0; }
  .md p, .md ul, .md ol, .md pre, .md table, .md h1, .md h2, .md h3, .md h4 { margin: 8px 0; }
  .md h1, .md h2, .md h3, .md h4 { font-size: 15px; }
  .md ul, .md ol { padding-left: 22px; }
  .md code { background: var(--code); border-radius: 4px; padding: 0 4px; font: 13px/1.5 ui-monospace, Consolas, monospace; }
  .md pre { background: var(--code); border-radius: 8px; padding: 10px 12px; overflow-x: auto; }
  .md pre code { background: none; padding: 0; }
  .md table { border-collapse: collapse; display: block; overflow-x: auto; }
  .md th, .md td { border: 1px solid var(--line); padding: 4px 8px; text-align: left; vertical-align: top; }
  .md a { color: var(--accent); }
  .md blockquote { margin: 8px 0; padding-left: 10px; border-left: 3px solid var(--line); color: var(--muted); }
  .tool { font-size: 13px; color: var(--muted); margin: 4px 0; }
  .tool summary { cursor: pointer; font-family: ui-monospace, Consolas, monospace; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .tool pre { max-height: 260px; overflow: auto; background: var(--code); border-radius: 8px; padding: 8px 10px;
              margin: 6px 0 0; font: 12px/1.5 ui-monospace, Consolas, monospace; white-space: pre-wrap; }
  .thinking { color: var(--muted); font-size: 13px; }
  .thinking::after { content: "…"; animation: blink 1.2s infinite; }
  @keyframes blink { 50% { opacity: .2; } }
  .notice { color: var(--muted); font-size: 13px; }
  .foot { color: var(--muted); font-size: 12px; margin-top: 6px; }
  .error { color: var(--error); }
  .card { border: 1px solid var(--line); border-left: 4px solid var(--accent); border-radius: 10px;
          padding: 10px 12px; background: var(--panel); }
  .card.warn { border-left-color: var(--warn); }
  .card .q { margin-bottom: 8px; overflow-wrap: anywhere; }
  .card .actions { display: flex; flex-wrap: wrap; gap: 8px; }
  .card .result { color: var(--muted); font-size: 13px; }
  .diff { max-height: 320px; overflow: auto; background: var(--code); border-radius: 8px; margin: 8px 0;
          font: 12px/1.5 ui-monospace, Consolas, monospace; }
  .diff div { padding: 0 10px; white-space: pre; }
  .diff .add { background: var(--add); }
  .diff .del { background: var(--del); }
  footer { border-top: 1px solid var(--line); background: var(--panel); padding: 10px 16px 14px; }
  form { max-width: 820px; margin: 0 auto; display: flex; gap: 8px; align-items: flex-end; }
  textarea {
    flex: 1; resize: none; font: inherit; color: var(--text); background: var(--bg);
    border: 1px solid var(--line); border-radius: 10px; padding: 9px 12px; min-height: 44px; max-height: 200px;
  }
  textarea:focus, button:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; }
  .hint { max-width: 820px; margin: 6px auto 0; color: var(--muted); font-size: 12px; }
  @media (max-width: 600px) {
    header, main, footer { padding-left: 12px; padding-right: 12px; }
    header h1 { flex: 1; }
    .chips { order: 3; flex-basis: 100%; flex-wrap: nowrap; overflow-x: auto; }
    .chip { flex-shrink: 0; }
    .msg.user { max-width: 100%; }
  }
</style>
</head>
<body>
<header>
  <h1>小助理</h1>
  <div class="chips" id="chips"></div>
  <button type="button" id="remember" title="把一條規則寫進工作區的 ASSISTANT.md">記住規則</button>
  <button type="button" id="clear">新對話</button>
</header>
<main id="scroller">
  <div class="log" id="log" aria-live="polite"></div>
</main>
<footer>
  <form id="form">
    <textarea id="input" rows="1" placeholder="想做什麼?例如:找出 calc.py 的 bug、摘要 @會議紀錄.docx、上網查…" aria-label="輸入問題"></textarea>
    <button type="submit" class="primary" id="send">送出</button>
  </form>
  <div class="hint">Enter 送出、Shift+Enter 換行 · 用 @檔名 附上工作區的檔案 · 修改套用前、上網前都會先問你</div>
</footer>
<script>
const TOKEN = "__TOKEN__";
const $ = (id) => document.getElementById(id);
const log = $("log"), input = $("input"), send = $("send");
let bot = null;           // 目前這一輪的回答區塊
let busy = false;
const tools = [];         // 依序等結果的工具區塊
const cards = {};         // 確認 / 套用卡片:id → 元素

function api(path, body) {
  return fetch(path, {
    method: body === undefined ? "GET" : "POST",
    headers: { "X-Token": TOKEN, "Content-Type": "application/json" },
    body: body === undefined ? undefined : JSON.stringify(body),
  }).then(async (r) => ({ ok: r.ok, data: await r.json().catch(() => ({})) }));
}

// ---------- 迷你 markdown(先跳脫 HTML,只轉常用語法) ----------
const esc = (s) => s.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;");
function inline(s) {
  return esc(s)
    .replace(/`([^`]+)`/g, "<code>$1</code>")
    .replace(/\*\*([^*]+)\*\*/g, "<strong>$1</strong>")
    .replace(/\[([^\]]+)\]\((https?:\/\/[^)\s]+)\)/g, '<a href="$2" target="_blank" rel="noopener noreferrer">$1</a>')
    .replace(/(^|[\s(（])(https?:\/\/[^\s<)）]+)/g, '$1<a href="$2" target="_blank" rel="noopener noreferrer">$2</a>')
    .replace(/&lt;br\s*\/?&gt;/g, "<br>");
}
const isTableRow = (l) => /^\s*\|.*\|\s*$/.test(l);
const isSep = (l) => /^\s*\|?\s*:?-{2,}:?\s*(\|\s*:?-{2,}:?\s*)*\|?\s*$/.test(l);
const isList = (l) => /^\s*([-*]|\d+\.)\s+/.test(l);
function table(rows) {
  const cells = (r) => r.trim().replace(/^\|/, "").replace(/\|$/, "").split("|").map((c) => inline(c.trim()));
  const body = rows.filter((r) => !isSep(r));
  const head = cells(body.shift() || "");
  return "<table><thead><tr>" + head.map((c) => `<th>${c}</th>`).join("") + "</tr></thead><tbody>" +
    body.map((r) => "<tr>" + cells(r).map((c) => `<td>${c}</td>`).join("") + "</tr>").join("") + "</tbody></table>";
}
function md(src) {
  const lines = src.replace(/\r/g, "").split("\n"), out = [];
  let i = 0;
  while (i < lines.length) {
    const l = lines[i];
    let m;
    if (/^\s*```/.test(l)) {
      const buf = []; i++;
      while (i < lines.length && !/^\s*```/.test(lines[i])) buf.push(lines[i++]);
      i++; out.push("<pre><code>" + esc(buf.join("\n")) + "</code></pre>");
    } else if (isTableRow(l)) {
      const rows = []; while (i < lines.length && isTableRow(lines[i])) rows.push(lines[i++]);
      out.push(table(rows));
    } else if ((m = l.match(/^(#{1,6})\s+(.*)/))) {
      const n = Math.min(m[1].length + 1, 4); out.push(`<h${n}>${inline(m[2])}</h${n}>`); i++;
    } else if (isList(l)) {
      const ordered = /^\s*\d+\./.test(l), items = [];
      while (i < lines.length && isList(lines[i])) items.push("<li>" + inline(lines[i++].replace(/^\s*([-*]|\d+\.)\s+/, "")) + "</li>");
      out.push(ordered ? `<ol>${items.join("")}</ol>` : `<ul>${items.join("")}</ul>`);
    } else if (/^\s*(---+|\*\*\*+)\s*$/.test(l)) {
      out.push("<hr>"); i++;
    } else if (/^>\s?/.test(l)) {
      const buf = []; while (i < lines.length && /^>\s?/.test(lines[i])) buf.push(lines[i++].replace(/^>\s?/, ""));
      out.push("<blockquote>" + buf.map(inline).join("<br>") + "</blockquote>");
    } else if (!l.trim()) {
      i++;
    } else {
      const buf = [];
      do { buf.push(lines[i++]); }  // 至少吃一行,避免卡住
      while (i < lines.length && lines[i].trim() && !/^\s*(```|#{1,6}\s|>|---)/.test(lines[i]) && !isTableRow(lines[i]) && !isList(lines[i]));
      out.push("<p>" + buf.map(inline).join("<br>") + "</p>");
    }
  }
  return out.join("");
}

// ---------- 畫面 ----------
const nearBottom = () => { const s = $("scroller"); return s.scrollHeight - s.scrollTop - s.clientHeight < 80; };
function add(el) {
  const stick = nearBottom();
  $("log").querySelector(".empty")?.remove();
  log.appendChild(el);
  if (stick) el.scrollIntoView({ block: "end" });
  return el;
}
function el(tag, cls, text) {
  const e = document.createElement(tag);
  if (cls) e.className = cls;
  if (text !== undefined) e.textContent = text;
  return e;
}
function showEmpty() {
  log.innerHTML = "";
  const box = el("div", "empty");
  box.append(el("p", "", "嗨,我是你的小助理。"), el("p", "", "可以請我找 bug、看 git 紀錄、在沙箱跑程式、讀 PDF / Word / Excel、寫文件存檔、上網查資料。"));
  log.appendChild(box);
}
function setBusy(b) {
  busy = b; send.disabled = b; $("clear").disabled = b;
  send.textContent = b ? "回答中…" : "送出";
}
function ensureBot() {
  if (!bot) {
    bot = add(el("div", "msg bot"));
    bot.raw = ""; bot.textEl = null; bot.thinkEl = null;
  }
  return bot;
}
function stopThinking() { if (bot && bot.thinkEl) { bot.thinkEl.remove(); bot.thinkEl = null; } }
// 文字片段很密,合併到下一個畫面更新再重繪。記住「要重繪哪個元素」而不是看目前的 bot:
// 這一輪的 done 可能比畫面更新早到,那時 bot 已經清掉,最後一段就會沒畫出來(10/9 實測踩到)
const dirty = new Set();
let pending = false;
function renderText(target) {
  dirty.add(target);
  if (pending) return;
  pending = true;
  requestAnimationFrame(flush);
}
function flush() {  // 背景分頁不跑 requestAnimationFrame,所以一輪結束時也直接呼叫,保證畫完
  pending = false;
  const stick = nearBottom();
  for (const t of dirty) t.innerHTML = md(t.raw);
  dirty.clear();
  if (stick) $("scroller").scrollTop = $("scroller").scrollHeight;
}
function diffView(text) {
  const box = el("div", "diff");
  for (const line of text.split("\n")) {
    const cls = line.startsWith("+") && !line.startsWith("+++") ? "add" : line.startsWith("-") && !line.startsWith("---") ? "del" : "";
    box.appendChild(el("div", cls, line || " "));
  }
  return box;
}

const handlers = {
  user(e) { bot = null; tools.length = 0; add(el("div", "msg user", e.text)).scrollIntoView({ block: "end" }); setBusy(true); },
  thinking() {
    const b = ensureBot();
    if (!b.thinkEl) { b.thinkEl = b.appendChild(el("div", "thinking", "思考中")); }
  },
  text(e) {
    const b = ensureBot(); stopThinking();
    if (!b.textEl) { b.textEl = b.appendChild(el("div", "md")); b.textEl.raw = ""; }
    b.textEl.raw += e.text; renderText(b.textEl);
  },
  tool(e) {
    const b = ensureBot(); stopThinking(); b.textEl = null;  // 工具後面的文字另起一段
    const d = b.appendChild(el("details", "tool"));
    const args = JSON.stringify(e.args);
    d.appendChild(el("summary", "", `${e.name} ${args.length > 120 ? args.slice(0, 120) + "…" : args}`));
    d.out = d.appendChild(el("pre", "", "執行中…"));
    tools.push(d);
  },
  tool_done(e) { const d = tools.shift(); if (d) d.out.textContent = e.output; },
  step() { stopThinking(); },
  notice(e) { ensureBot().appendChild(el("div", "notice", `(${e.text})`)); },
  done(e) {
    stopThinking(); flush();
    const b = ensureBot();
    if (!b.querySelector(".md")) { const t = b.appendChild(el("div", "md")); t.innerHTML = md(e.answer || ""); }
    b.appendChild(el("div", "foot", `— ${e.role} · ${e.steps} 步 · ${e.tokens.toLocaleString()} tokens(這段對話累計 ${e.total.toLocaleString()})`));
    bot = null; setBusy(false);
  },
  error(e) { stopThinking(); flush(); ensureBot().appendChild(el("div", "error", `錯誤:${e.text}`)); bot = null; setBusy(false); },
  confirm(e) {
    stopThinking();
    const card = add(el("div", "card warn"));
    const q = card.appendChild(el("div", "q"));
    q.append(`AI 想要${e.action}:`, el("code", "", e.detail));
    const actions = card.appendChild(el("div", "actions"));
    for (const [label, answer, cls] of [["允許這次", "y", "primary"], ["之後都允許", "a", ""], ["不要", "n", ""]]) {
      const btn = actions.appendChild(el("button", cls, label));
      btn.type = "button";
      btn.onclick = () => { actions.querySelectorAll("button").forEach((x) => (x.disabled = true)); api("/api/confirm", { id: e.id, answer }); };
    }
    cards[e.id] = card; bot = null;
    card.scrollIntoView({ block: "end", behavior: "smooth" });  // 要使用者按按鈕的卡片一定要看得到
  },
  confirm_done(e) {
    const card = cards[e.id]; if (!card) return;
    card.querySelector(".actions")?.remove();
    card.appendChild(el("div", "result", { y: "✓ 已允許這次", a: "✓ 已允許(之後同類動作不再問)", n: "✗ 沒有允許" }[e.answer] || ""));
  },
  offer_apply(e) {
    const card = add(el("div", e.passed ? "card" : "card warn"));
    card.appendChild(el("div", "q", e.passed ? `修改已通過沙箱測試:${e.name}` : `注意:套用這個修改後沙箱測試沒有通過:${e.name}`));
    card.appendChild(diffView(e.diff));
    const actions = card.appendChild(el("div", "actions"));
    for (const [label, apply, cls] of [["套用到工作區", true, e.passed ? "primary" : ""], ["先不要", false, ""]]) {
      const btn = actions.appendChild(el("button", cls, label));
      btn.type = "button";
      btn.onclick = async () => {
        actions.querySelectorAll("button").forEach((x) => (x.disabled = true));
        const r = await api("/api/apply", { patch: e.patch, apply });
        if (r.data.text && r.data.text.startsWith("小助理還在")) { alert(r.data.text); actions.querySelectorAll("button").forEach((x) => (x.disabled = false)); }
      };
    }
    cards["patch" + e.patch] = card;
    card.scrollIntoView({ block: "end", behavior: "smooth" });
  },
  applied(e) {
    const card = cards["patch" + e.patch]; if (!card) return;
    card.querySelector(".actions")?.remove();
    card.appendChild(el("div", "result", e.text));
  },
  clear() { bot = null; tools.length = 0; showEmpty(); setBusy(false); },
};

function connect() {
  const es = new EventSource(`/api/events?token=${encodeURIComponent(TOKEN)}`);
  es.onmessage = (m) => { const e = JSON.parse(m.data); (handlers[e.kind] || (() => {}))(e); };
}

async function loadState() {
  const r = await api("/api/state");
  if (!r.ok) return;
  const chips = $("chips"); chips.innerHTML = "";
  const chip = (text, title) => { const c = chips.appendChild(el("span", "chip", text)); c.title = title || text; };
  chip(`工作區 ${r.data.workspace.split(/[\\/]/).pop()}`, r.data.workspace);
  chip(r.data.status);
  if (r.data.instructions) chip("已讀取 ASSISTANT.md");
  setBusy(r.data.busy);
}

$("form").onsubmit = async (ev) => {
  ev.preventDefault();
  const text = input.value.trim();
  if (!text || busy) return;
  input.value = ""; autosize();
  const r = await api("/api/ask", { text });
  if (!r.ok) { alert(r.data.error || "送出失敗"); input.value = text; }
};
input.addEventListener("keydown", (ev) => {
  if (ev.key === "Enter" && !ev.shiftKey && !ev.isComposing) { ev.preventDefault(); $("form").requestSubmit(); }
});
function autosize() { input.style.height = "auto"; input.style.height = Math.min(input.scrollHeight, 200) + "px"; }
input.addEventListener("input", autosize);
$("clear").onclick = async () => {
  const r = await api("/api/clear", {});
  if (!r.ok) alert(r.data.error || "開新對話失敗");
  input.focus();
};
$("remember").onclick = async () => {
  const rule = prompt("要小助理記住的規則(會寫進工作區的 ASSISTANT.md):\n例如:回答都要附檔案路徑");
  if (rule && rule.trim()) { await api("/api/remember", { rule }); loadState(); }
};

showEmpty();
loadState();
connect();
input.focus();
</script>
</body>
</html>
