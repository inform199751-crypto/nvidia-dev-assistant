// ---------- 把資料夾拖進來(像 Claude):瀏覽器拿不到資料夾原本的位置,只拿得到裡面的檔案 ----------
// 所以先問路徑:貼了(而且裡面的檔案對得上)就直接用原本的資料夾,HSUAN 改的東西套用時會寫回去;
// 留空就把檔案傳一份副本給 HSUAN(只看、分析,原本的不會變)
const UP_SKIP_DIRS = new Set(["node_modules", ".git", ".venv", "venv", "__pycache__", "dist", "build", ".next", "target", ".idea", ".vs"]);
const UP_BINARY = /\.(exe|dll|so|dylib|zip|7z|rar|gz|tar|iso|mp4|mov|avi|mkv|mp3|wav|bin|pyc|class|jar|psd|ai)$/i;
const UP_FILE = 5e6, UP_TOTAL = 50e6, UP_COUNT = 2000, UP_BATCH = 6e6;  // 跟伺服器的 UPLOAD_MAX_* 一樣
const readEntries = (dir) => new Promise((ok, fail) => {  // readEntries 一次只給一部分,要一直讀到空的
  const reader = dir.createReader(), out = [];
  const next = () => reader.readEntries((batch) => { if (!batch.length) return ok(out); out.push(...batch); next(); }, fail);
  next();
});
async function walkFolder(entry, base, out) {
  if (out.length > UP_COUNT * 2) return;
  if (entry.isFile) {
    out.push({ path: entry.fullPath.slice(base.length + 1), file: await new Promise((ok, fail) => entry.file(ok, fail)) });
  } else if (entry.fullPath === base || !(entry.name.startsWith(".") || UP_SKIP_DIRS.has(entry.name))) {
    for (const child of await readEntries(entry)) await walkFolder(child, base, out);
  }
}
const fileB64 = (file) => new Promise((ok, fail) => {
  const r = new FileReader();
  r.onload = () => ok(String(r.result).split(",")[1] || "");
  r.onerror = () => fail(new Error(`讀不到 ${file.name}`));
  r.readAsDataURL(file);
});
async function dropFolder(root) {
  if (!desk.can_add_projects) return alert("這裡不能加資料夾(訪客或多人模式)");
  const all = [];
  await walkFolder(root, root.fullPath, all);
  const files = [];
  let total = 0, skipped = 0;
  for (const x of all) {
    const name = x.path.split("/").pop();
    if (name.startsWith(".") || UP_BINARY.test(name) || x.file.size > UP_FILE || files.length >= UP_COUNT
        || total + x.file.size > UP_TOTAL) { skipped++; continue; }
    files.push(x); total += x.file.size;
  }
  if (!files.length) return alert(`「${root.name}」裡沒有可以讀的檔案`);
  // 抽樣幾個檔案的大小:HSUAN 用它在這台電腦上找原本的資料夾、或檢查使用者貼的路徑對不對
  const expect = files.filter((_, i) => i % Math.ceil(files.length / 20) === 0).map((x) => ({ path: x.path, size: x.file.size }));
  const decl = {};  // 試用平台上「這不是公司資料」只問一次
  const found = await apiDeclared("/api/project/locate", { name: root.name, expect }, decl);
  if (found.cancelled) return;
  if (found.status === 400) return alert(found.data.error);  // 例如找到了,但在公司資料夾裡
  if (found.ok && found.data.project) {  // 自己找到了:直接用原本的資料夾,不用問(10/10 使用者嫌每次都要貼路徑)
    return openDropped(found.data.project, `已找到「${root.name}」:${found.data.project.path}(HSUAN 改的東西,你按「套用到專案」才會寫進去)`);
  }
  const path = prompt(`HSUAN 在桌面、文件、下載裡找不到「${root.name}」。\n要讓 HSUAN 能直接修改裡面的檔案,請貼上這個資料夾的完整路徑\n`
    + "(在檔案總管上方的網址列按右鍵 →「複製位址」)。\n\n"
    + `留空按「確定」= 只上傳一份副本給 HSUAN 看(${files.length} 個檔案、${fmtSize(total)}),原本的檔案不會被改。`
    + (skipped ? `\n(會略過 ${skipped} 個隱藏檔、執行檔或太大的檔案)` : ""), "");
  if (path === null) return;  // 按了取消
  let proj;
  try {
    if (path.trim()) {  // 用原本的資料夾:伺服器會比對幾個檔案的大小,貼錯資料夾就擋下來
      const r = await apiDeclared("/api/project/add", { path, expect }, decl);
      if (r.cancelled) return;
      if (!r.ok) return alert(r.data.error || "加入失敗");
      proj = r.data;
    } else {
      let upload = null, batch = [], size = 0, sent = 0;
      const flush = async (done) => {
        const r = await apiDeclared("/api/project/upload", { name: root.name, upload, done, files: batch }, decl);
        if (r.cancelled) throw new Error("");  // 沒確認不是公司資料:不上傳,也不用跳錯誤
        if (!r.ok) throw new Error(r.data.error || "上傳失敗");
        upload = r.data.upload || upload; sent += batch.length; batch = []; size = 0;
        $("hint").textContent = `上傳「${root.name}」中… ${sent} / ${files.length}`;
        return r.data;
      };
      for (const x of files) {
        batch.push({ path: x.path, data: await fileB64(x.file) }); size += x.file.size;
        if (size >= UP_BATCH) await flush(false);
      }
      proj = await flush(true);
    }
  } catch (e) { applyMode(); if (e.message) alert(e.message); return; }
  openDropped(proj, proj.source === "upload" ? `已上傳「${root.name}」的副本(${proj.files} 個檔案),原本的資料夾不會被改`
                                              : `已加入「${root.name}」:${proj.path}`);
}

// 輸入框的「選模型」:上面是努力程度滑桿,下面是模型;這段對話之後都用它們。自動 = 依難度和長度選
// 努力程度:[代碼, 名稱, 說明](伺服器端的實際設定在 agent.EFFORTS)
const EFFORTS = [["low", "低", "不思考,最快、最省 token"], ["medium", "中", "平常的問題用這個就好"],
                 ["high", "高", "開思考、可以多做幾步,回答前先查證"], ["max", "超高", "開思考、步數加倍,最仔細也最慢"]];
const effortAt = () => Math.max(0, EFFORTS.findIndex(([k]) => k === (state.effort || "medium")));
function renderModel() {
  const cur = (state.roles || []).find((r) => r.role === (state.role ?? null));
  $("model-name").textContent = (cur ? cur.name : "自動") + (effortAt() === 1 ? "" : ` · ${EFFORTS[effortAt()][1]}`);
}
function effortPanel() {
  const box = el("div", "effort");
  const head = box.appendChild(el("div", "effort-head"));
  head.appendChild(el("span", "", "努力程度"));
  const name = head.appendChild(el("b"));
  const ends = box.appendChild(el("div", "effort-ends"));
  ends.append(el("span", "", "更快"), el("span", "", "更聰明"));
  const range = box.appendChild(el("input"));
  Object.assign(range, { type: "range", min: 0, max: EFFORTS.length - 1, step: 1, value: effortAt() });
  range.setAttribute("aria-label", "努力程度");
  const ticks = box.appendChild(el("div", "effort-ticks"));
  for (const [k] of EFFORTS) ticks.appendChild(el("span", "", k === "medium" ? "推薦" : ""));
  const desc = box.appendChild(el("small"));
  const show = (i) => { name.textContent = EFFORTS[i][1]; desc.textContent = EFFORTS[i][2]; };
  show(effortAt());
  range.oninput = () => show(+range.value);
  range.onchange = async () => {
    const x = await api("/api/effort", { effort: EFFORTS[+range.value][0] });
    if (!x.ok) { alert(x.data.error || "換努力程度失敗"); range.value = effortAt(); show(effortAt()); return; }
    state.effort = x.data.effort; renderModel();
  };
  return box;
}

async function submit(clicked = false) {
  const text = input.value.trim(), images = pendingImages;
  if (!conv) return;
  if (busy && !text && !images.length) {  // 回答中、輸入框空的:按鈕是「停止」(按 Enter 不會誤停)
    if (clicked) { send.disabled = true; await api("/api/stop", {}); }
    return;
  }
  if (!text && !images.length) return;
  const mode = planMode ? "plan" : "normal", split = splitMode && !$("split-mode").hidden;
  input.value = ""; pendingImages = []; renderThumbs(); autosize(); updateSend(); setPlanMode(false); setSplitMode(false);
  const r = await api("/api/ask", { text, mode, images, split });
  if (!r.ok) {  // 沒送出去:文字和圖片都放回去
    alert(r.data.error || "送出失敗");
    input.value = text; pendingImages = images; renderThumbs(); autosize(); updateSend(); setPlanMode(mode === "plan");
    setSplitMode(split);
  }
}
