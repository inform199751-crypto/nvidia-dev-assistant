<!doctype html>
<html lang="zh-Hant" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#0a0a0a"><!-- 桌面版(Edge app 模式)的標題列顏色 -->
<title>HSUAN</title>
<link rel="icon" href="/favicon.ico">
<!-- 手機「加到主畫面」:圖示和全螢幕(iPhone 看 apple-* 那幾個,Android 看 manifest) -->
<link rel="manifest" href="/manifest.webmanifest">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<meta name="apple-mobile-web-app-title" content="HSUAN">
<script>  /* 外觀(預設深色):在畫面畫出來之前就設好,才不會先閃一下白的;10/10 拿掉的淺色、跟著系統回到深色 */
  try {
    const t = localStorage.getItem("theme");
    document.documentElement.dataset.theme = ["gold", "red", "navy", "carbon", "mono", "yellow", "blue"].includes(t) ? t : "dark";
  } catch (e) { /* 不能存就用預設 */ }
</script>
<style>
  /* 版面參考 Claude / ChatGPT 桌面版:左側欄(新增、成品、待命、自訂、更多,下面是專案和對話),中間置中的對話欄。
     外觀:<html data-theme> = dark(預設,黑底)或下面幾組配色,在「設定」切換。每組都要給齊全部變數;
     --accent 是填色(按鈕、進度條),--accent-text 是當文字用的(「測試通過」、「先規劃」、焦點框),沒給就跟 --accent 一樣。
     參考 awesome-design-md 的車廠分析時只取配色,不用品牌名稱、標誌和專屬字型;主色不能跟錯誤 / 警告同色。
     10/10 每組都用 WCAG 算過對比:內文 >= 4.5,次要文字和介面 >= 3 */
  :root, :root[data-theme="dark"] {
    color-scheme: dark;  /* 捲軸等瀏覽器內建元件跟著深淺色 */
    --bg: #121212; --sidebar: #0a0a0a; --text: #ececec; --muted: #b4b4b4; --faint: #858585;
    --line: #2a2a2a; --hover: #1e1e1e; --active: #262626; --user: #242424; --input: #1c1c1c; --code: #0a0a0a;
    --btn: #ffffff; --btn-ink: #0d0d0d; --btn-off: #4a4a4a; --accent: #10a37f; --accent-ink: #ffffff;
    --dot: #f0b45b; --warn: #f59e0b; --error: #f87171; --add: #10291e; --del: #331717;
    --shadow: 0 2px 12px rgba(0, 0, 0, .5);
  }
  /* 黑金(藍寶堅尼):純黑底、金色是唯一的彩色;警告改成偏紅的橘(原本的橘黃跟金色分不出來) */
  :root[data-theme="gold"] {
    color-scheme: dark;
    --bg: #000000; --sidebar: #0a0a0a; --text: #ffffff; --muted: #b8b8b8; --faint: #7d7d7d;
    --line: #262626; --hover: #161616; --active: #202020; --user: #202020; --input: #0f0f0f; --code: #0d0d0d;
    --btn: #ffc000; --btn-ink: #000000; --btn-off: #3a3a3a; --accent: #ffc000; --accent-ink: #000000;
    --dot: #ffc000; --dot-ink: #000000; --warn: #ff6a3d; --error: #ff5c5c; --add: #102a17; --del: #3a1414;
    --shadow: 0 2px 14px rgba(0, 0, 0, .7);
  }
  /* 賽道紅(法拉利):深灰黑底、紅色只用在主要按鈕;錯誤改成偏粉的淺紅、警告用黃色 */
  :root[data-theme="red"] {
    color-scheme: dark;
    --bg: #181818; --sidebar: #111111; --text: #ffffff; --muted: #b5b5b5; --faint: #8f8f8f;
    --line: #303030; --hover: #232323; --active: #303030; --user: #2a2a2a; --input: #202020; --code: #111111;
    --btn: #da291c; --btn-ink: #ffffff; --btn-off: #4a4a4a; --accent: #da291c; --accent-ink: #ffffff;
    --dot: #f6e500; --dot-ink: #000000; --warn: #f6e500; --error: #ff8a9a; --add: #102a17; --del: #3a1418;
    --shadow: 0 2px 12px rgba(0, 0, 0, .55);
  }
  /* 深海藍(BMW):深藍灰底、藍色按鈕;藍色當文字太暗,改用淺藍 */
  :root[data-theme="navy"] {
    color-scheme: dark;
    --bg: #1a2129; --sidebar: #141a21; --text: #ffffff; --muted: #c3c9d1; --faint: #8a94a1;
    --line: #2f3946; --hover: #222b35; --active: #262e38; --user: #262e38; --input: #202832; --code: #141a21;
    --btn: #1c69d4; --btn-ink: #ffffff; --btn-off: #3b4552; --accent: #1c69d4; --accent-text: #7cb1f7; --accent-ink: #ffffff;
    --dot: #f59e0b; --dot-ink: #000000; --warn: #f59e0b; --error: #f87171; --add: #13301f; --del: #3a1d22;
    --shadow: 0 2px 12px rgba(0, 0, 0, .5);
  }
  /* 碳纖黑(BMW M):純黑底、碳灰卡片、白色按鈕、藍色重點。不做 M 的三色條紋(那是它的商標) */
  :root[data-theme="carbon"] {
    color-scheme: dark;
    --bg: #000000; --sidebar: #0d0d0d; --text: #ffffff; --muted: #bbbbbb; --faint: #7e7e7e;
    --line: #262626; --hover: #1a1a1a; --active: #262626; --user: #1a1a1a; --input: #111111; --code: #0d0d0d;
    --btn: #ffffff; --btn-ink: #000000; --btn-off: #3c3c3c; --accent: #1c69d4; --accent-text: #5aa0ec; --accent-ink: #ffffff;
    --dot: #f4b400; --dot-ink: #000000; --warn: #f4b400; --error: #ff5c5c; --add: #102a17; --del: #3a1414;
    --shadow: 0 2px 14px rgba(0, 0, 0, .7);
  }
  /* 純黑白(Bugatti):只有黑白,沒有彩色重點;「測試通過」另外用綠色 */
  :root[data-theme="mono"] {
    color-scheme: dark;
    --bg: #000000; --sidebar: #0a0a0a; --text: #ffffff; --muted: #cccccc; --faint: #999999;
    --line: #262626; --hover: #141414; --active: #1f1f1f; --user: #141414; --input: #0d0d0d; --code: #0d0d0d;
    --btn: #ffffff; --btn-ink: #000000; --btn-off: #3a3a3a; --accent: #ffffff; --accent-ink: #000000;
    --dot: #d4a017; --dot-ink: #000000; --warn: #d4a017; --error: #ff6b6b; --add: #102a17; --del: #3a1414;
    --shadow: 0 2px 14px rgba(0, 0, 0, .7);
  }
  /* 黃黑(Renault):白底、黃色按鈕配黑字;黃色當文字看不見,文字一律用黑色 */
  :root[data-theme="yellow"] {
    color-scheme: light;
    --bg: #ffffff; --sidebar: #f7f7f7; --text: #000000; --muted: #333333; --faint: #666666;
    --line: #e6e6e6; --hover: #f0f0f0; --active: #ebebeb; --user: #f7f7f7; --input: #ffffff; --code: #f7f7f7;
    --btn: #ffed00; --btn-ink: #000000; --btn-off: #d7d7d7; --accent: #ffed00; --accent-text: #000000; --accent-ink: #000000;
    --dot: #000000; --dot-ink: #ffed00; --warn: #c2410c; --error: #b42318; --add: #e7f6ec; --del: #fdecec;
    --shadow: 0 2px 12px rgba(0, 0, 0, .08);
  }
  /* 電光藍(Tesla):白底、只有一個藍色 */
  :root[data-theme="blue"] {
    color-scheme: light;
    --bg: #ffffff; --sidebar: #f4f4f4; --text: #171a20; --muted: #393c41; --faint: #5c5e62;
    --line: #e2e3e4; --hover: #ececec; --active: #e6e6e6; --user: #f4f4f4; --input: #ffffff; --code: #f4f4f4;
    --btn: #3e6ae1; --btn-ink: #ffffff; --btn-off: #d0d1d2; --accent: #3e6ae1; --accent-ink: #ffffff;
    --dot: #f59e0b; --dot-ink: #000000; --warn: #b45309; --error: #d93025; --add: #e7f6ec; --del: #fdecec;
    --shadow: 0 2px 12px rgba(0, 0, 0, .06);
  }
  /* 「測試通過」不能用主色的:紅色看起來像失敗(10/10 截圖看到)、白色看不出是好消息 → 改成綠色 */
  :root[data-theme="red"] .tag.ok, :root[data-theme="mono"] .tag.ok { color: #3ddc84; background: rgba(61, 220, 132, .14); }
  /* 黃黑:黃色進度條和「回答中」的點在白底上看不到,改成黑色 */
  :root[data-theme="yellow"] :is(.usage-bar i, .conv .dot.busy) { background: #000000; border-color: #000000; }
  /* 小圓角:這幾家的按鈕都是直角或接近直角,改成小圓角(俐落,但不會太硬) */
  :root:is([data-theme="gold"], [data-theme="carbon"], [data-theme="navy"], [data-theme="blue"])
    :is(.composer, .msg.user, .card, .rows, .popup, .phone, .none, .plan, .md pre, .tool pre,
        .diff, .page pre.rules, .field input, .msg-images img, .thumb) { border-radius: 4px; }
  :root:is([data-theme="gold"], [data-theme="carbon"], [data-theme="navy"], [data-theme="blue"])
    :is(.pill, .chip, .mode-btn, .tag, .send, .round-btn, .nav-btn, .conv, .model-pick, .icon-btn,
        .mode-switch, .mode-switch button, .side-user, .popup button) { border-radius: 3px; }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body {
    background: var(--bg); color: var(--text); display: flex; overflow: hidden;
    font: 16px/1.75 ui-sans-serif, system-ui, -apple-system, "Segoe UI", "Microsoft JhengHei", "PingFang TC", "Noto Sans TC", sans-serif;
  }
  button { font: inherit; color: inherit; cursor: pointer; }
  button:disabled { cursor: default; }
  button:focus-visible, textarea:focus-visible, input:focus-visible { outline: 2px solid var(--accent-text, var(--accent)); outline-offset: 2px; }
  svg { display: block; flex-shrink: 0; }
  [hidden] { display: none !important; }

  /* ---------- 側邊欄 ---------- */
  aside {
    width: 268px; flex-shrink: 0; background: var(--sidebar); display: flex; flex-direction: column;
    font-size: 14px; line-height: 1.5; border-right: 1px solid var(--line);
  }
  .side-scroll { flex: 1; overflow-y: auto; padding: 8px 8px 12px; }
  .side-top { display: flex; align-items: center; gap: 6px; padding: 6px 6px 10px; }
  .brand { display: flex; align-items: center; gap: 8px; font-weight: 600; font-size: 15px; }
  /* 對話 / 程式切換(像 Claude 桌面版左上角那兩個圖示) */
  .mode-switch { display: flex; gap: 2px; padding: 2px; margin-left: auto; border-radius: 10px; background: var(--hover); }
  .mode-switch button { border: 0; background: none; border-radius: 8px; padding: 4px 8px; color: var(--faint); }
  .mode-switch button:hover { color: var(--text); }
  .mode-switch button[aria-pressed="true"] { background: var(--bg); color: var(--text); box-shadow: 0 0 0 1px var(--line); }
  .brand img { width: 22px; height: 22px; border-radius: 6px; box-shadow: 0 0 0 1px var(--line); }  /* 圖示本身是黑的,黑底上要一圈邊才看得到 */
  .nav-btn, .conv {
    display: flex; align-items: center; gap: 10px; width: 100%; text-align: left;
    background: none; border: 0; border-radius: 8px; padding: 6px 8px; color: var(--text);
  }
  .nav-btn:hover:not(:disabled), .conv:hover { background: var(--hover); }
  .nav-btn[aria-current="page"] { background: var(--active); }
  .nav-btn .plus { width: 20px; height: 20px; border-radius: 50%; background: var(--active); display: grid; place-items: center; }
  .nav-btn.more { color: var(--muted); }
  .badge { margin-left: auto; min-width: 18px; height: 18px; border-radius: 9px; background: var(--dot); color: var(--dot-ink, #fff);
           font-size: 11px; font-weight: 600; display: grid; place-items: center; padding: 0 5px; }
  .project { margin-top: 14px; }
  .project-head { display: flex; align-items: center; gap: 2px; padding: 2px 4px 2px 8px; color: var(--muted); font-size: 13px; }
  .project-name { flex: 1; min-width: 0; display: flex; align-items: center; gap: 4px; background: none; border: 0; padding: 2px 0;
                  color: inherit; text-align: left; overflow: hidden; }
  .project-name span { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .project-name svg { transition: transform .15s; }
  .project.collapsed .project-name svg { transform: rotate(-90deg); }
  .project.collapsed .conv-list { display: none; }
  .conv { position: relative; padding-right: 30px; }
  .conv[aria-current="true"] { background: var(--active); }
  .conv .dot { width: 7px; height: 7px; border-radius: 50%; border: 1.5px solid var(--faint); flex-shrink: 0; }
  .conv .dot.on { background: var(--faint); border-color: var(--faint); }
  .conv .dot.busy { background: var(--accent); border-color: var(--accent); animation: pulse 1.2s infinite; }
  .conv .dot.wait { background: var(--dot); border-color: var(--dot); }
  .conv .title { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .conv .menu-btn { position: absolute; right: 4px; top: 50%; transform: translateY(-50%); opacity: 0; }
  .conv:hover .menu-btn, .conv:focus-within .menu-btn { opacity: 1; }
  .empty-proj { color: var(--faint); font-size: 13px; padding: 2px 10px 2px 26px; }
  .recent .project-head { padding: 2px 8px; }
  .recent .empty-proj { padding-left: 8px; }
  .add-project { color: var(--muted); margin-top: 10px; font-size: 13px; }
  /* 左下角:點了打開帳號選單 */
  .side-user { display: flex; align-items: center; gap: 10px; width: 100%; padding: 10px 12px; border: 0; border-top: 1px solid var(--line);
               background: none; color: var(--text); text-align: left; font-size: 14px; line-height: 1.3; }
  .side-user:hover { background: var(--hover); }
  .side-user img { width: 28px; height: 28px; border-radius: 8px; box-shadow: 0 0 0 1px var(--line); }
  .side-user .who { flex: 1; min-width: 0; }
  .side-user .who-name { display: block; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .side-user .who small { color: var(--faint); font-size: 12px; display: block; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .side-user > svg { color: var(--faint); }
  /* 今天的 token 用量:八成以上變橘、用完變紅 */
  .usage-bar { display: block; height: 4px; border-radius: 2px; background: var(--line); margin-top: 4px; overflow: hidden; }
  .usage-bar i { display: block; height: 100%; width: 0; background: var(--accent); }
  .usage-bar.high i { background: var(--warn); }
  .usage-bar.full i { background: var(--error); }
  .usage-big { font-size: 26px; font-weight: 700; }
  .usage-big small { font-size: 14px; font-weight: 400; color: var(--faint); }
  .page .usage-bar { height: 8px; border-radius: 4px; margin: 8px 0 6px; max-width: 420px; }
  .pins { display: flex; gap: 22px; flex-wrap: wrap; }
  .icon-btn { background: none; border: 0; border-radius: 8px; padding: 6px; color: var(--muted); }
  .icon-btn:hover { background: var(--hover); color: var(--text); }
  #close-side, #open-side { display: none; }
  .popup { position: fixed; z-index: 30; background: var(--bg); border: 1px solid var(--line); border-radius: 12px;
           box-shadow: var(--shadow); padding: 4px; min-width: 140px; }
  .popup button { display: flex; align-items: center; gap: 10px; width: 100%; text-align: left; background: none; border: 0;
                  border-radius: 8px; padding: 6px 10px; font-size: 14px; }
  .popup button:hover { background: var(--hover); }
  .popup button.danger { color: var(--error); }
  .popup button .label { flex: 1; min-width: 0; }
  .popup button .right { color: var(--faint); font-size: 12.5px; white-space: nowrap; }
  .popup button svg { color: var(--muted); }
  .popup hr { border: 0; border-top: 1px solid var(--line); margin: 4px 6px; }
  .popup .head { padding: 6px 10px 4px; font-size: 14px; font-weight: 600; overflow-wrap: anywhere; }
  .popup .head small { display: block; color: var(--faint); font-size: 12.5px; font-weight: 400; }
  .changelog h3 { color: var(--text); }
  .changelog ul { margin: 0; padding-left: 22px; }
  .changelog li { margin: 4px 0; font-size: 15px; }

  /* ---------- 主畫面 ---------- */
  .main { flex: 1; min-width: 0; display: flex; flex-direction: column; }
  .topbar { display: flex; align-items: center; gap: 8px; padding: 10px 16px; min-height: 52px; }
  .model { font-size: 17px; font-weight: 600; display: flex; align-items: baseline; gap: 6px; min-width: 0; }
  .model span { color: var(--faint); font-weight: 400; font-size: 14px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .top-spacer { flex: 1; }
  .term-toggle[aria-pressed="true"], .panel-toggle[aria-pressed="true"] { background: var(--active); color: var(--text); }
  /* 終端機面板(10/23):在輸入框上面,只有這台電腦看得到 */
  .term { max-width: 768px; margin: 0 auto 10px; border: 1px solid var(--line); border-radius: 12px; background: var(--code);
          display: flex; flex-direction: column; height: min(38vh, 360px); }
  .term-head { display: flex; align-items: center; gap: 6px; padding: 6px 8px 6px 12px; border-bottom: 1px solid var(--line); font-size: 13px; }
  .term-title { font-weight: 600; }
  .term-cwd { flex: 1; min-width: 0; color: var(--faint); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font: 12px ui-monospace, Consolas, monospace; }
  .term-head .pill { padding: 2px 10px; font-size: 12.5px; }
  .term-out { flex: 1; margin: 0; padding: 8px 12px; overflow: auto; font: 12.5px/1.5 ui-monospace, "Cascadia Code", Consolas, monospace;
              white-space: pre-wrap; overflow-wrap: anywhere; color: var(--text); }
  .term-out .cmd { color: var(--accent-text, var(--accent)); }
  .term-out .end { color: var(--faint); }
  .term-line { display: flex; gap: 6px; align-items: center; padding: 6px 12px; border-top: 1px solid var(--line);
               font: 12.5px ui-monospace, Consolas, monospace; }
  .term-line span { color: var(--faint); white-space: nowrap; max-width: 45%; overflow: hidden; text-overflow: ellipsis; }
  .term-line input { flex: 1; min-width: 0; background: none; border: 0; color: var(--text); font: inherit; outline: none; }
  /* 公司資料保護:用的是試用平台時一直掛在右上角 */
  .trial-badge { flex-shrink: 0; border: 1px solid color-mix(in srgb, var(--warn) 45%, transparent);
                 background: color-mix(in srgb, var(--warn) 12%, transparent); border-radius: 999px;
                 color: color-mix(in srgb, var(--warn) 75%, var(--text));  /* 摻一點內文色:淺底的黃黑、電光藍才到 4.5 */
                 padding: 2px 10px; font-size: 12.5px; font-weight: 600; white-space: nowrap; }
  /* 右邊的工作狀態面板(10/24,像 Claude 桌面版):環境、背景資訊、變更 */
  .panel { width: 300px; flex-shrink: 0; background: var(--sidebar); border-left: 1px solid var(--line);
           display: flex; flex-direction: column; font-size: 14px; line-height: 1.5; }
  .panel-head { display: flex; align-items: center; gap: 6px; padding: 10px 10px 4px 16px; min-height: 52px; font-weight: 600; }
  .panel-head span { flex: 1; }
  .panel-body { flex: 1; overflow-y: auto; padding: 4px 12px 16px; display: flex; flex-direction: column; gap: 12px; }
  .pcard { border: 1px solid var(--line); border-radius: 14px; padding: 10px 12px; background: var(--bg); }
  .pcard h4 { display: flex; align-items: center; gap: 8px; margin: 0 0 6px; font-size: 13.5px; font-weight: 600; }
  .pcard h4 .right { margin-left: auto; display: flex; align-items: center; gap: 8px; color: var(--faint); font-weight: 400; }
  .prow { display: flex; align-items: center; gap: 8px; padding: 3px 0; min-width: 0; }
  .prow svg { color: var(--faint); }
  .prow span { min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .pnote { color: var(--faint); font-size: 12.5px; margin: 4px 0 0; }
  .pcard .actions { margin-top: 10px; }
  .pcard .pill { padding: 4px 12px; font-size: 13px; }
  /* 用了幾成:圓環 */
  .ring { width: 16px; height: 16px; border-radius: 50%; flex-shrink: 0;
          background: conic-gradient(var(--ring, var(--accent)) calc(var(--p) * 1%), var(--line) 0);
          -webkit-mask: radial-gradient(circle, transparent 4px, #000 4.5px); mask: radial-gradient(circle, transparent 4px, #000 4.5px); }
  .ring.high { --ring: var(--warn); }
  .n-add { color: #3fb950; } .n-del { color: var(--error); }
  :root:is([data-theme="yellow"], [data-theme="blue"]) .n-add { color: #1a7f37; }  /* 白底要深一點的綠 */
  .pfile summary { display: flex; align-items: center; gap: 8px; padding: 3px 4px; border-radius: 6px; cursor: pointer; list-style: none; }
  .pfile summary::-webkit-details-marker { display: none; }
  .pfile summary:hover { background: var(--hover); }
  .pfile summary .name { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
                         font: 12.5px ui-monospace, Consolas, monospace; }

  /* 分頁:狀態 / 變更 / 檔案 / 瀏覽器;變更、檔案、瀏覽器比較寬,左邊緣可以拖拉調寬度 */
  .panel { position: relative; }

  /* 視窗不夠寬時(側邊欄 + 加寬的面板會把對話擠到看不見):加寬的面板改成蓋在右邊,不擠中間 */
  @media (max-width: 1100px) {
    .panel.wide { position: fixed; inset: 0 0 0 auto; z-index: 20; width: min(var(--panel-w, 560px), 92vw); box-shadow: var(--shadow); }
  }
  .pane { display: flex; flex-direction: column; gap: 12px; }
  .pane[data-tab="browser"] { flex: 1; min-height: 0; }
  .pbar { display: flex; gap: 6px; align-items: center; }
  .pbar input { flex: 1; min-width: 0; font: inherit; font-size: 13.5px; padding: 5px 10px; border: 1px solid var(--line); border-radius: 8px;
                background: var(--bg); color: var(--text); }
  .pane h5 { margin: 6px 0 0; font-size: 12.5px; font-weight: 600; color: var(--muted); }
  .flist { font-size: 13.5px; }
  .fdir > summary, .ffile { display: flex; align-items: center; gap: 6px; width: 100%; padding: 2px 6px; border: 0; border-radius: 6px;
                            background: none; color: var(--text); text-align: left; cursor: pointer; list-style: none; font: inherit; }
  .fdir > summary::-webkit-details-marker { display: none; }
  .fdir > summary:hover, .ffile:hover { background: var(--hover); }

  .fkids { padding-left: 14px; }

  .fhead { font: 12.5px ui-monospace, Consolas, monospace; color: var(--muted); overflow-wrap: anywhere; }
  pre.src { margin: 0; background: var(--code); border: 1px solid var(--line); border-radius: 10px; padding: 8px 10px; overflow: auto;
            font: 12px/1.55 ui-monospace, "Cascadia Code", Consolas, monospace; white-space: pre; tab-size: 4; }
  pre.src .ln { display: inline-block; color: var(--faint); margin-right: 12px; text-align: right; user-select: none; }
  .seg { display: inline-flex; gap: 2px; padding: 2px; border-radius: 10px; background: var(--hover); align-self: flex-start; }
  .seg button { border: 0; background: none; color: var(--faint); border-radius: 8px; padding: 3px 12px; font-size: 13px; }

  /* 新對話:圖示、名稱、一句說明、輸入框、快捷按鈕都放在畫面中間;開始對話後輸入框回到最下面 */
  body.hero .log { min-height: 100%; justify-content: center; }

  .welcome { text-align: center; padding-bottom: 6vh; }
  .welcome .logo { width: 52px; height: 52px; border-radius: 14px; box-shadow: 0 0 0 1px var(--line); }
  .welcome h1 { font-size: 30px; font-weight: 700; margin: 14px 0 4px; letter-spacing: .02em; }

  .chips { display: flex; gap: 10px; justify-content: center; flex-wrap: wrap; margin-top: 16px; }

          border-radius: 999px; padding: 7px 16px; font-size: 14px; color: var(--muted); }
  .chip:hover { background: var(--hover); color: var(--text); }
  .chip.more { width: 36px; height: 36px; padding: 0; justify-content: center; }
  .msg { overflow-wrap: anywhere; }
  .msg.user { align-self: flex-end; max-width: 75%; background: var(--user); border-radius: 22px; padding: 10px 18px; white-space: pre-wrap; }
  .msg.user .mode-tag { display: block; font-size: 12px; color: var(--accent-text, var(--accent)); font-weight: 600; margin-bottom: 2px; }
  .msg-images { display: flex; flex-wrap: wrap; gap: 6px; margin: 2px 0 6px; }
  .msg-images img { display: block; max-width: 180px; max-height: 140px; border-radius: 12px; }
  .msg.bot > :first-child { margin-top: 0; }
  .msg.bot > :last-child { margin-bottom: 0; }
  .md p, .md ul, .md ol, .md pre, .md table, .md blockquote { margin: 10px 0; }
  .md h2, .md h3, .md h4 { margin: 18px 0 8px; line-height: 1.4; }
  .md h2 { font-size: 20px; } .md h3 { font-size: 18px; } .md h4 { font-size: 16px; }
  .md ul, .md ol { padding-left: 24px; }
  .md li { margin: 3px 0; }
  .md hr { border: 0; border-top: 1px solid var(--line); margin: 18px 0; }
  .md code { background: var(--code); border-radius: 6px; padding: 1px 6px; font: 14px/1.6 ui-monospace, "Cascadia Code", Consolas, monospace; }
  .md pre { background: var(--code); border: 1px solid var(--line); border-radius: 12px; padding: 12px 16px; overflow-x: auto; }
  .md pre code { background: none; padding: 0; }
  .md table { border-collapse: collapse; display: block; overflow-x: auto; font-size: 15px; }
  .md th, .md td { border-bottom: 1px solid var(--line); padding: 6px 12px; text-align: left; vertical-align: top; }
  .md th { font-weight: 600; }
  .md a { color: var(--text); text-decoration: underline; text-decoration-color: var(--faint); }
  .md blockquote { padding-left: 14px; border-left: 3px solid var(--line); color: var(--muted); }

  .tool { font-size: 14px; color: var(--muted); margin: 6px 0; }
  .tool summary { cursor: pointer; display: inline-flex; align-items: center; gap: 6px; max-width: 100%;
                  border-radius: 8px; padding: 2px 8px 2px 4px; list-style: none; }
  .tool summary::-webkit-details-marker { display: none; }
  .tool summary::before { content: "›"; font-size: 16px; width: 12px; text-align: center; transition: transform .15s; }
  .tool[open] summary::before { transform: rotate(90deg); }
  .tool summary:hover { background: var(--hover); color: var(--text); }
  .tool summary span { flex-shrink: 0; }
  .tool summary code { font: 13px ui-monospace, Consolas, monospace; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; min-width: 0; }
  .tool pre { max-height: 280px; overflow: auto; background: var(--code); border: 1px solid var(--line); border-radius: 12px;
              padding: 10px 12px; margin: 6px 0 0; font: 12.5px/1.55 ui-monospace, Consolas, monospace; white-space: pre-wrap; }
  /* 網頁成品:對話裡的「預覽 / 分享」、成品頁的分享連結和 QR code */
  .page-actions { display: flex; gap: 8px; margin: 2px 0 8px; }
  a.pill { display: inline-flex; align-items: center; text-decoration: none; color: inherit; }
  .row a.share-link { display: block; font-size: 13px; overflow-wrap: anywhere; color: var(--accent-text, var(--accent)); }
  .share-qr { padding: 10px; background: #fff; border-radius: 8px; }
  .share-qr svg { width: 200px; height: 200px; }
  /* 多 agent 分工(delegate):每個子助理一列 */
  .tool .subs { margin: 6px 0 2px; padding-left: 24px; }
  .tool .subs li { margin: 4px 0; color: var(--text); }
  .tool .subs small { display: block; color: var(--faint); font: 12.5px/1.5 ui-monospace, Consolas, monospace;
                      overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .tool .subs li.done small { color: var(--accent-text, var(--accent)); }
  .tool .subs li.failed small { color: var(--error); }
  .thinking { color: var(--faint); font-size: 15px; display: flex; align-items: center; gap: 8px; }
  .thinking::before { content: ""; width: 10px; height: 10px; border-radius: 50%; background: var(--text); animation: pulse 1.2s infinite; }
  @keyframes pulse { 0%, 100% { transform: scale(.6); opacity: .4; } 50% { transform: scale(1); opacity: 1; } }
  .notice { color: var(--faint); font-size: 14px; }
  .foot { color: var(--faint); font-size: 13px; margin-top: 8px; }
  .error { color: var(--error); }
  .plan { border: 1px solid var(--line); border-radius: 14px; padding: 10px 14px; margin: 8px 0; font-size: 15px; }
  .plan .title { font-size: 13px; color: var(--faint); margin-bottom: 4px; }
  .plan ol { list-style: none; margin: 0; padding: 0; }
  .plan li { display: flex; gap: 8px; align-items: baseline; padding: 2px 0; }
  .plan li::before { content: "○"; color: var(--faint); width: 16px; flex-shrink: 0; text-align: center; }
  .plan li.in_progress { font-weight: 600; }
  .plan li.in_progress::before { content: "◐"; color: var(--accent-text, var(--accent)); }
  .plan li.done { color: var(--faint); text-decoration: line-through; }
  .plan li.done::before { content: "✓"; color: var(--accent-text, var(--accent)); }

  .card { border: 1px solid var(--line); border-radius: 16px; padding: 14px 16px; background: var(--bg); box-shadow: var(--shadow); }
  .card .q { margin-bottom: 10px; overflow-wrap: anywhere; line-height: 1.6; }
  .tag { display: inline-block; font-size: 12px; font-weight: 600; border-radius: 999px; padding: 1px 8px; margin-right: 6px; vertical-align: 1px; }
  .tag.ok { background: color-mix(in srgb, var(--accent) 16%, transparent); color: var(--accent-text, var(--accent)); }
  .tag.warn { background: color-mix(in srgb, var(--warn) 16%, transparent); color: var(--warn); }
  .card code { background: var(--code); border-radius: 6px; padding: 1px 6px; font: 14px ui-monospace, Consolas, monospace; }
  .actions { display: flex; flex-wrap: wrap; gap: 8px; }
  .pill { border-radius: 999px; padding: 6px 16px; font-size: 14px; font-weight: 500; border: 1px solid var(--line); background: var(--bg); }
  .pill:hover:not(:disabled) { background: var(--hover); }
  .pill.primary { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
  .pill.primary:hover:not(:disabled) { background: color-mix(in srgb, var(--accent) 85%, black); }
  .pill.dark { background: var(--btn); border-color: var(--btn); color: var(--btn-ink); }
  .pill:disabled { opacity: .5; }
  .card .result { color: var(--muted); font-size: 14px; }
  .diff { max-height: 320px; overflow: auto; background: var(--code); border: 1px solid var(--line); border-radius: 12px; margin: 0 0 12px;
          font: 12.5px/1.6 ui-monospace, Consolas, monospace; padding: 6px 0; }
  .diff div { padding: 0 12px; white-space: pre; }
  .diff .add { background: var(--add); }
  .diff .del { background: var(--del); }

  /* ---------- 側邊欄打開的頁面:成品 / 待命 / 自訂 / 更多 ---------- */
  .page { flex: 1; overflow-y: auto; }
  .page-in { max-width: 768px; margin: 0 auto; padding: 8px 24px 40px; }
  .page h2 { font-size: 24px; margin: 4px 0 4px; }
  .page .lead { color: var(--faint); margin: 0 0 20px; font-size: 14px; }
  .page h3 { font-size: 15px; margin: 26px 0 8px; color: var(--muted); font-weight: 600; }
  .rows { border: 1px solid var(--line); border-radius: 14px; overflow: hidden; }
  .row { display: flex; align-items: center; gap: 12px; padding: 10px 14px; border-top: 1px solid var(--line); }
  .row:first-child { border-top: 0; }
  .row .grow { flex: 1; min-width: 0; }
  .row .name { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .row small { color: var(--faint); display: block; font-size: 12.5px; overflow-wrap: anywhere; }  /* 長路徑才不會壓到按鈕 */
  .row .actions { flex-shrink: 0; }
  .none { color: var(--faint); font-size: 14px; padding: 14px; border: 1px dashed var(--line); border-radius: 14px; text-align: center; }
  .page pre.rules { background: var(--code); border: 1px solid var(--line); border-radius: 12px; padding: 12px 14px;
                    white-space: pre-wrap; font: 13px/1.6 ui-monospace, Consolas, monospace; max-height: 320px; overflow: auto; }
  .page textarea.config { display: block; width: 100%; min-height: 130px; resize: vertical; background: var(--code); color: var(--text);
                          border: 1px solid var(--line); border-radius: 12px; padding: 10px 12px; font: 13px/1.6 ui-monospace, Consolas, monospace; }
  .field { display: flex; gap: 8px; margin-top: 10px; }
  .field input { flex: 1; min-width: 0; font: inherit; font-size: 14px; padding: 7px 12px; border: 1px solid var(--line);
                 border-radius: 10px; background: var(--bg); color: var(--text); }
  .kv { display: grid; grid-template-columns: 120px 1fr; gap: 6px 12px; font-size: 14px; }
  .kv dt { color: var(--faint); }
  .kv dd { margin: 0; overflow-wrap: anywhere; }
  .help li { margin: 4px 0; font-size: 14px; }
  .phone { display: flex; gap: 18px; align-items: center; border: 1px solid var(--line); border-radius: 14px; padding: 14px; margin-bottom: 8px; }
  .phone .qr { width: 168px; flex-shrink: 0; border-radius: 10px; overflow: hidden; }
  .phone .qr svg { width: 100%; height: auto; }
  .phone .grow { flex: 1; min-width: 0; }
  .phone .pin-label { color: var(--faint); font-size: 13px; }
  .phone .pin { font: 600 32px/1.2 ui-monospace, Consolas, monospace; letter-spacing: .15em; }
  .phone .url { font: 14px/1.5 ui-monospace, Consolas, monospace; margin: 6px 0; overflow-wrap: anywhere; }
  .phone small { display: block; color: var(--faint); font-size: 12.5px; }

  /* ---------- 輸入框 ---------- */
  footer { padding: 0 16px 14px; }
  /* 兩層:上面打字;下面左邊附加檔案、先規劃,右邊選模型、送出 */
  .composer { max-width: 768px; margin: 0 auto; display: flex; flex-direction: column; gap: 6px; background: var(--input);
              border: 1px solid var(--line); border-radius: 22px; padding: 12px 10px 10px 14px; box-shadow: var(--shadow); }
  textarea { width: 100%; resize: none; border: 0; outline: none; background: transparent; color: var(--text);
             font: inherit; line-height: 1.6; padding: 2px 2px; max-height: 200px; min-height: 28px; }
  .composer-bar { display: flex; align-items: center; gap: 6px; }
  .composer.drop { border-color: var(--accent-text, var(--accent)); }  /* 圖片拖進來的時候 */
  /* 還沒送出的圖片:縮圖 + 右上角的 × */
  .thumbs { display: flex; flex-wrap: wrap; gap: 8px; }
  .thumbs:empty { display: none; }
  .thumb { position: relative; width: 64px; height: 64px; border-radius: 10px; overflow: hidden; box-shadow: 0 0 0 1px var(--line); }
  .thumb img { display: block; width: 100%; height: 100%; object-fit: cover; }
  .thumb button { position: absolute; top: 3px; right: 3px; width: 20px; height: 20px; padding: 0; border: 0; border-radius: 50%;
                  background: rgba(0, 0, 0, .65); color: #fff; font-size: 13px; line-height: 20px; }
  .thumbs-note { width: 100%; color: var(--faint); font-size: 12px; }
  .composer-bar .spacer { flex: 1; }
  .model-pick { display: inline-flex; align-items: center; gap: 4px; background: none; border: 0; border-radius: 8px;
                padding: 4px 8px; font-size: 14px; font-weight: 600; color: var(--text); max-width: 46vw; }
  .model-pick span { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .model-pick:hover { background: var(--hover); }
  .popup button small { display: block; color: var(--faint); font-size: 12px; }
  /* 「選模型」上面的努力程度滑桿(像 Claude 的):更快 ↔ 更聰明,「推薦」標在「中」下面 */
  .effort { padding: 8px 10px 6px; min-width: 270px; font-size: 14px; }
  .effort-head { display: flex; justify-content: space-between; align-items: baseline; }
  .effort-head span { color: var(--faint); }
  .effort-ends { display: flex; justify-content: space-between; color: var(--faint); font-size: 12.5px; margin-top: 8px; }
  .effort input { width: 100%; margin: 6px 0 0; accent-color: var(--btn); }
  .effort-ticks { display: flex; justify-content: space-between; margin: 0 -12px; font-size: 12px; color: var(--faint); }
  .effort-ticks span { width: 40px; text-align: center; }  /* 滑桿的圓點寬約 16px:每格中心對到它停的位置 */
  .effort small { display: block; color: var(--faint); font-size: 12.5px; margin-top: 2px; }
  textarea::placeholder { color: var(--faint); }
  .mode-btn { flex-shrink: 0; align-self: center; display: inline-flex; align-items: center; gap: 4px; border: 1px solid var(--line);
              background: transparent; border-radius: 999px; padding: 4px 12px 4px 9px; font-size: 13px; color: var(--muted); }
  .mode-btn:hover { background: var(--hover); color: var(--text); }
  .mode-btn[aria-pressed="true"] { border-color: var(--accent-text, var(--accent)); color: var(--accent-text, var(--accent)); background: color-mix(in srgb, var(--accent) 10%, transparent); }
  .round-btn { flex-shrink: 0; align-self: center; width: 32px; height: 32px; border-radius: 50%; border: 0; background: transparent;
               color: var(--muted); display: grid; place-items: center; }
  .round-btn:hover { background: var(--hover); color: var(--text); }
  .send { width: 36px; height: 36px; border-radius: 50%; border: 0; flex-shrink: 0; background: var(--btn); color: var(--btn-ink);
          display: grid; place-items: center; }
  .send:disabled { background: var(--btn-off); }
  .send.stop { display: grid; place-items: center; }
  .hint { max-width: 768px; margin: 8px auto 0; text-align: center; color: var(--faint); font-size: 12px; }

  /* ---------- 手機:側邊欄改成抽屜 ---------- */
  .scrim { display: none; }
  @media (max-width: 768px) {
    aside { position: fixed; inset: 0 auto 0 0; z-index: 20; transform: translateX(-100%); transition: transform .2s; box-shadow: var(--shadow); }

    #close-side, #open-side { display: block; }
    .panel { position: fixed; inset: 0 0 0 auto; z-index: 20; width: min(320px, 88vw); box-shadow: var(--shadow); }
    .panel.wide { width: 100vw; }
    .panel-grip, .pane-btn { display: none !important; }  /* 手機:用面板上面的分頁切換 */
    .log, .page-in { padding-left: 16px; padding-right: 16px; }
    .msg.user { max-width: 88%; }
    .welcome h1 { font-size: 26px; }
    .chip { padding: 6px 12px; font-size: 13px; }
    .kv { grid-template-columns: 1fr; }
    .phone { flex-direction: column; align-items: flex-start; }
    .conv .menu-btn { opacity: 1; }
  }
</style>

<aside id="sidebar" aria-label="側邊欄">

          <svg width="16" height="16" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linejoin="round"><path d="M4 4.5h12A1.5 1.5 0 0117.5 6v7a1.5 1.5 0 01-1.5 1.5H9l-3.5 3v-3H4A1.5 1.5 0 012.5 13V6A1.5 1.5 0 014 4.5z"/></svg>

          <svg width="16" height="16" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M7 6l-4 4 4 4M13 6l4 4-4 4"/></svg>

        <svg width="18" height="18" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M5 5l10 10M15 5L5 15"/></svg>
      </button>
    </div>
    <nav aria-label="主選單">

<script>
const TOKEN = "__TOKEN__";

// 外觀:深色 + 參考車廠官網的配色(10/10 拿掉淺色、跟著系統);標題列(桌面版、手機)的顏色跟側邊欄一樣
const THEMES = [["dark", "深色"], ["gold", "黑金"], ["red", "賽道紅"], ["navy", "深海藍"], ["carbon", "碳纖黑"],
                ["mono", "純黑白"], ["yellow", "黃黑"], ["blue", "電光藍"]];
const BAR_COLORS = { dark: "#0a0a0a", gold: "#0a0a0a", red: "#111111", navy: "#141a21", carbon: "#0d0d0d", mono: "#0a0a0a",
                     yellow: "#f7f7f7", blue: "#f4f4f4" };
function setTheme(t) {

}

function api(path, body, convId) {
  return fetch(path, {
    method: body === undefined ? "GET" : "POST",
    headers: { "X-Token": TOKEN, "Content-Type": "application/json", "X-Conv": convId || conv || "" },
    body: body === undefined ? undefined : JSON.stringify(body),
  }).then(async (r) => ({ ok: r.ok, status: r.status, data: await r.json().catch(() => ({})) }));
}
// 加資料夾(專案、知識庫、拖進來的):試用平台上伺服器回 409 need=declare,先問一次「這不是公司資料」,確認了才帶 public 再送。
// decl 讓同一次動作的幾個請求只問一次(拖資料夾:找位置 → 貼路徑 / 上傳)
async function apiDeclared(path, body, decl = {}) {
  let r = await api(path, decl.yes ? { ...body, public: true } : body);
  if (r.status === 409 && r.data.need === "declare") {
    if (!confirm(`${r.data.error}。\n\n按「確定」= 我確認這不是公司資料(公司的程式碼、客戶資料、內部文件都不能放)。`))
      return { ok: false, cancelled: true, status: 409, data: {} };
    decl.yes = true;
    r = await api(path, { ...body, public: true });
  }
  return r;
}

// ---------- 迷你 markdown(先跳脫 HTML,只轉常用語法) ----------
const esc = (s) => s.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;");
function inline(s) {
  return esc(s)
    .replace(/`([^`]+)`/g, "<code>$1</code>")
    .replace(/\*\*([^*]+)\*\*/g, "<strong>$1</strong>")
    .replace(/\[([^\]]+)\]\((https?:\/\/[^)\s]+)\)/g, '<a href="$2" target="_blank" rel="noopener noreferrer">$1</a>')
    .replace(/(^|[\s(（])(https?:\/\/[^\s<)）]+)/g, '$1<a href="$2" target="_blank" rel="noopener noreferrer">$2</a>')
    .replace(/&lt;br\s*\/?&gt;/g, "<br>");
}
const isTableRow = (l) => /^\s*\|.*\|\s*$/.test(l);
const isSep = (l) => /^\s*\|?\s*:?-{2,}:?\s*(\|\s*:?-{2,}:?\s*)*\|?\s*$/.test(l);
const isList = (l) => /^\s*([-*]|\d+\.)\s+/.test(l);
function table(rows) {
  const cells = (r) => r.trim().replace(/^\|/, "").replace(/\|$/, "").split("|").map((c) => inline(c.trim()));
  const body = rows.filter((r) => !isSep(r));
  const head = cells(body.shift() || "");
  return "<table><thead><tr>" + head.map((c) => `<th>${c}</th>`).join("") + "</tr></thead><tbody>" +
    body.map((r) => "<tr>" + cells(r).map((c) => `<td>${c}</td>`).join("") + "</tr>").join("") + "</tbody></table>";
}
function md(src) {
  const lines = src.replace(/\r/g, "").split("\n"), out = [];
  let i = 0;
  while (i < lines.length) {
    const l = lines[i];
    let m;
    if (/^\s*```/.test(l)) {
      const buf = []; i++;
      while (i < lines.length && !/^\s*```/.test(lines[i])) buf.push(lines[i++]);
      // 結束那行如果帶語言(```diff),其實是下一個區塊的開頭:模型漏寫了結尾(10/9 實測寫成「\]」),
      // 吃掉它的話後面整篇的程式碼框都會錯位
      if (i < lines.length && /^\s*```\s*$/.test(lines[i])) i++;
      out.push("<pre><code>" + esc(buf.join("\n")) + "</code></pre>");
    } else if (isTableRow(l)) {
      const rows = []; while (i < lines.length && isTableRow(lines[i])) rows.push(lines[i++]);
      out.push(table(rows));
    } else if ((m = l.match(/^(#{1,6})\s+(.*)/))) {
      const n = Math.min(m[1].length + 1, 4); out.push(`<h${n}>${inline(m[2])}</h${n}>`); i++;
    } else if (isList(l)) {
      const ordered = /^\s*\d+\./.test(l), items = [];
      while (i < lines.length && isList(lines[i])) items.push("<li>" + inline(lines[i++].replace(/^\s*([-*]|\d+\.)\s+/, "")) + "</li>");
      out.push(ordered ? `<ol>${items.join("")}</ol>` : `<ul>${items.join("")}</ul>`);
    } else if (/^\s*(---+|\*\*\*+)\s*$/.test(l)) {
      out.push("<hr>"); i++;
    } else if (/^>\s?/.test(l)) {
      const buf = []; while (i < lines.length && /^>\s?/.test(lines[i])) buf.push(lines[i++].replace(/^>\s?/, ""));
      out.push("<blockquote>" + buf.map(inline).join("<br>") + "</blockquote>");
    } else if (!l.trim()) {
      i++;
    } else {
      const buf = [];
      do { buf.push(lines[i++]); }  // 至少吃一行,避免卡住
      while (i < lines.length && lines[i].trim() && !/^\s*(```|#{1,6}\s|>|---)/.test(lines[i]) && !isTableRow(lines[i]) && !isList(lines[i]));
      out.push("<p>" + buf.map(inline).join("<br>") + "</p>");
    }
  }
  return out.join("");
}

const fmtSize = (n) => n < 1024 ? `${n} B` : n < 1048576 ? `${(n / 1024).toFixed(1)} KB` : `${(n / 1048576).toFixed(1)} MB`;
const fmtTime = (t) => new Date(t * 1000).toLocaleString("zh-TW", { month: "numeric", day: "numeric", hour: "2-digit", minute: "2-digit" });

function useChip([, , text, plan]) {
  if (plan) setPlanMode(true);

  input.setSelectionRange(text.length, text.length);

// ---------- 送出 / 狀態 ----------
// 回答中(10/16 使用者要的,像 Claude):輸入框空的 → 按鈕是「停止」;打了字 → 一樣是「送出」,HSUAN 下一步就看到
function updateSend() {
  const has = !!input.value.trim() || pendingImages.length > 0, stop = busy && !has;
  send.classList.toggle("stop", stop);
  send.innerHTML = stop ? STOP_ICON : SEND_ICON;
  send.setAttribute("aria-label", stop ? "停止回答" : busy ? "送出(HSUAN 下一步就會看到)" : "送出");
  send.title = stop ? "停止回答" : busy ? "回答到一半也可以送出:HSUAN 下一步就會看到" : "";
  send.disabled = !busy && !has;
}
function setBusy(b) {
  busy = b;
  updateSend();
}
function ensureBot() {
  if (!bot) { bot = add(el("div", "msg bot")); bot.textEl = null; bot.thinkEl = null; }
  return bot;
}
function stopThinking() { if (bot && bot.thinkEl) { bot.thinkEl.remove(); bot.thinkEl = null; } }

// 文字片段很密,合併到下一個畫面更新再重繪。記住「要重繪哪個元素」而不是看目前的 bot:
// 這一輪的 done 可能比畫面更新早到,那時 bot 已經清掉,最後一段就會沒畫出來(10/9 實測踩到)
const dirty = new Set();
let pending = false;
function renderText(target) {
  dirty.add(target);
  if (pending) return;
  pending = true;
  requestAnimationFrame(flush);
}
function flush() {  // 背景分頁不跑 requestAnimationFrame,所以一輪結束時也直接呼叫,保證畫完
  pending = false;
  const stick = nearBottom();
  for (const t of dirty) t.innerHTML = md(t.raw);
  dirty.clear();
  if (stick) $("scroller").scrollTop = $("scroller").scrollHeight;
}
function diffView(text) {
  const box = el("div", "diff");
  for (const line of text.split("\n")) {
    const cls = line.startsWith("+") && !line.startsWith("+++") ? "add" : line.startsWith("-") && !line.startsWith("---") ? "del" : "";
    box.appendChild(el("div", cls, line || " "));
  }
  return box;
}
function cardButtons(card, specs) {
  const actions = card.appendChild(el("div", "actions"));
  for (const [label, cls, onclick] of specs) {
    const b = actions.appendChild(button(label, "pill " + cls, async () => {
      actions.querySelectorAll("button").forEach((x) => (x.disabled = true));
      if ((await onclick()) === false) actions.querySelectorAll("button").forEach((x) => (x.disabled = false));
    }));
  }
  return actions;
}
function renderPlan(box, steps) {
  box.innerHTML = "";
  box.appendChild(el("div", "title", "計畫進度"));
  const list = box.appendChild(el("ol"));
  for (const s of steps) list.appendChild(el("li", ["pending", "in_progress", "done"].includes(s.status) ? s.status : "pending", s.step || ""));
}
const refreshSoon = () => { later("desk", loadDesk); later("pending", loadPending); later("state", loadState); };

// ---------- 事件 ----------
const heardWaiting = [];  // 回答到一半送出、HSUAN 還沒看到的訊息泡泡
function markHeard() {
  for (const m of heardWaiting.splice(0)) { const t = m.querySelector(".mode-tag"); if (t) t.textContent = "回答中送出 · 已收到"; }
}
const handlers = {
  user(e) {
    // 回答到一半送的:正在寫的回答繼續寫在原本的泡泡(不要被切成兩半),HSUAN 看到這則訊息之後(heard / next)才另起一個;
    // 前面還在跑的工具結果也要接得上
    if (!e.queued) { bot = null; tools.length = 0; }
    const m = el("div", "msg user");
    const tags = [e.mode === "plan" && "先規劃", e.split && "分工", e.queued && "回答中送出"].filter(Boolean);
    if (tags.length) m.appendChild(el("span", "mode-tag", tags.join(" · ")));
    if (e.queued) heardWaiting.push(m);
    if (e.images?.length) {  // 附上的圖片(伺服器只留縮圖)
      const row = m.appendChild(el("div", "msg-images"));
      for (const src of e.images) Object.assign(row.appendChild(el("img")), { src, alt: "附上的圖片" });
    }
    m.append(e.text);
    add(m).scrollIntoView({ block: "end" }); setBusy(true); refreshSoon();
  },
  thinking() { const b = ensureBot(); if (!b.thinkEl) b.thinkEl = b.appendChild(el("div", "thinking", "思考中")); },
  text(e) {
    const b = ensureBot(); stopThinking();
    if (!b.textEl) { b.textEl = b.appendChild(el("div", "md")); b.textEl.raw = ""; }
    b.textEl.raw += e.text; renderText(b.textEl);
  },
  tool(e) {
    const b = ensureBot(); stopThinking(); b.textEl = null;  // 工具後面的文字另起一段
    const d = b.appendChild(el("details", "tool"));
    const summary = d.appendChild(el("summary"));
    const args = JSON.stringify(e.args);
    if (e.name === "delegate") {  // 多 agent 分工:每個子助理一列,顯示它現在在做什麼
      const tasks = Array.isArray(e.args?.tasks) ? e.args.tasks : [];
      summary.append(el("span", "", `分給 ${tasks.length} 個子助理同時調查`));
      d.open = true;
      const list = d.appendChild(el("ol", "subs"));
      b.subs = tasks.map((t) => {
        const li = list.appendChild(el("li"));
        li.append(el("div", "", String(t)));
        li.now = li.appendChild(el("small", "", "準備中…"));
        return li;
      });
    } else if (e.name === "save_memory") {  // 跨對話的記憶:寫成「記住:…」,點一下到設定頁看全部
      summary.append(el("span", "", "記住"), el("code", "", String(e.args?.fact || "")));
    } else summary.append(el("span", "", e.name), el("code", "", args.length > 100 ? args.slice(0, 100) + "…" : args));
    d.out = d.appendChild(el("pre", "", "執行中…"));
    d.toolName = e.name;
    tools.push(d);
  },
  tool_done(e) {
    const d = tools.shift(); if (!d) return;
    d.out.textContent = e.output;
    const saved = d.toolName === "save_document" && /^已存成 (.+)$/m.exec(e.output || "");
    if (saved) {  // 存好的文件:直接給「下載」;網頁另外有「預覽」和「分享」(預覽連結的鑰匙跟「成品」要)
      const name = saved[1].trim().split(/[\\/]/).pop();
      const bar = d.parentElement.insertBefore(el("div", "page-actions"), d.nextSibling);
      bar.append(button("下載", "pill", () => download(`/api/file?token=${encodeURIComponent(TOKEN)}&name=${encodeURIComponent(name)}`)));
      if (isPage(name)) {
        api("/api/outputs").then((x) => {
          const doc = (x.data.docs || []).find((o) => o.name === name);
          if (doc?.preview) bar.prepend(previewLink(doc.preview, "預覽網頁"));
        });
        bar.append(button("分享…", "pill", () => openPage("outputs")));
      }
    }
  },
  sub(e) {
    const li = ensureBot().subs?.[e.agent - 1];
    if (li && e.what === "tool") { const a = JSON.stringify(e.args); li.now.textContent = `▸ ${e.name} ${a.length > 80 ? a.slice(0, 80) + "…" : a}`; }
  },
  sub_done(e) {
    const li = ensureBot().subs?.[e.agent - 1];
    if (li) { li.now.textContent = e.status === "失敗" ? "✗ 沒有完成" : `✓ 完成(${e.status})`; li.classList.add(e.status === "失敗" ? "failed" : "done"); }
  },
  step() { stopThinking(); },
  heard() { markHeard(); stopThinking(); bot = null; },  // 回答到一半送的訊息:HSUAN 這一步看到了,之後的回答寫在它下面
  next() { markHeard(); stopThinking(); bot = null; setBusy(true); },  // 上一輪答完才送到的:接著當下一題回答
  notice(e) { ensureBot().appendChild(el("div", "notice", e.text)); },
  plan(e) {  // 照計畫執行時的進度清單:同一輪只有一份,每次更新就重畫
    const b = ensureBot(); stopThinking(); b.textEl = null;
    if (!b.planEl) b.planEl = b.appendChild(el("div", "plan"));
    renderPlan(b.planEl, e.steps || []);
  },
  done(e) {
    stopThinking(); flush();
    const b = ensureBot();
    if (!b.querySelector(".md")) { const t = b.appendChild(el("div", "md")); t.innerHTML = md(e.answer || ""); }
    b.appendChild(el("div", "foot", `${e.stopped ? "已停止 · " : ""}${e.role} · ${e.steps} 步 · ${e.tokens.toLocaleString()} tokens(這段對話累計 ${e.total.toLocaleString()})`));
    bot = null; setBusy(false); refreshSoon();
  },
  error(e) { stopThinking(); flush(); ensureBot().appendChild(el("div", "error", `錯誤:${e.text}`)); bot = null; setBusy(false); refreshSoon(); },
  confirm(e) {
    stopThinking();
    const card = add(el("div", "card"));
    const q = card.appendChild(el("div", "q"));
    q.append(el("span", "tag warn", "需要你同意"), `HSUAN 想要${e.action}:`, el("code", "", e.detail));
    cardButtons(card, [
      ["允許這次", "primary", () => api("/api/confirm", { id: e.id, answer: "y" })],
      ["之後都允許", "", () => api("/api/confirm", { id: e.id, answer: "a" })],
      ["不要", "", () => api("/api/confirm", { id: e.id, answer: "n" })],
    ]);
    cards[e.id] = card; bot = null; refreshSoon();
    card.scrollIntoView({ block: "end", behavior: "smooth" });  // 要使用者按按鈕的卡片一定要看得到
  },
  confirm_done(e) {
    refreshSoon();
    const card = cards[e.id]; if (!card) return;
    card.querySelector(".actions")?.remove();
    card.appendChild(el("div", "result", { y: "✓ 已允許這次", a: "✓ 已允許(之後同類動作不再問)", n: "✗ 沒有允許" }[e.answer] || ""));
  },
  offer_plan() {
    const card = add(el("div", "card"));
    const q = card.appendChild(el("div", "q"));
    q.append(el("span", "tag ok", "計畫"), "要照這個計畫執行嗎?執行時一樣會先問你才套用修改。");
    const go = (yes) => async () => {
      const r = await api("/api/execute", { go: yes });
      if (!r.ok) { alert(r.data.error || "失敗"); return false; }
    };
    cardButtons(card, [["照計畫執行", "primary", go(true)], ["先不要", "", go(false)]]);
    cards.plan = card; refreshSoon();
    card.scrollIntoView({ block: "end", behavior: "smooth" });
  },
  plan_answered(e) {
    refreshSoon();
    const card = cards.plan; if (!card) return;
    card.querySelector(".actions")?.remove();
    card.appendChild(el("div", "result", e.go ? "✓ 照計畫執行" : "沒有執行這個計畫"));
    cards.plan = null;
  },
  offer_escalate(e) {  // 一般模型做到步數上限:問要不要換難題模型接著做(比較慢,所以讓使用者決定)
    const card = add(el("div", "card"));
    const q = card.appendChild(el("div", "q"));
    q.append(el("span", "tag warn", "還沒完成"), `${e.used} 做到 ${e.steps} 步上限還沒完成。要換 ${e.model}(難題模型,比較慢)接著做嗎?`);
    const go = (yes) => async () => {
      const r = await api("/api/escalate", { go: yes });
      if (!r.ok) { alert(r.data.error || "失敗"); return false; }
    };
    cardButtons(card, [[`換 ${e.model} 接著做`, "primary", go(true)], ["先不要", "", go(false)]]);
    cards.escalate = card;
    card.scrollIntoView({ block: "end", behavior: "smooth" });
  },
  escalate_answered(e) {
    const card = cards.escalate; if (!card) return;
    card.querySelector(".actions")?.remove();
    card.appendChild(el("div", "result", e.go ? "✓ 換模型接著做" : "沒有換模型"));
    cards.escalate = null;
  },
  offer_apply(e) {
    const card = add(el("div", "card"));
    const q = card.appendChild(el("div", "q"));
    q.append(el("span", e.passed ? "tag ok" : "tag warn", e.passed ? "測試通過" : "測試沒過"),
             e.passed ? "要把草稿的修改套用到專案嗎?" : "注意:改完後沙箱測試沒有通過。仍要套用嗎?");
    q.appendChild(el("div", "notice", `修改都先放在 HSUAN 的草稿上,你的檔案還沒動。patch:${e.name}`));
    card.appendChild(diffView(e.diff));
    const choose = (action) => async () => {
      const r = await api("/api/apply", { patch: e.patch, action });
      if (r.data.text && r.data.text.startsWith("HSUAN 還在")) { alert(r.data.text); return false; }
    };
    // 每個 patch 都是累積的:有新的出來,舊卡片就不能再按,免得套到舊版本
    for (const [key, old] of Object.entries(cards)) {
      if (key.startsWith("patch") && old.querySelector(".actions")) {
        old.querySelector(".actions").remove();
        old.appendChild(el("div", "result", "已有更新的修改,請看下面"));
      }
    }
    if (e.copy) q.appendChild(el("div", "notice", "這個專案是拖進來的副本:套用只會改副本,原本的資料夾不會變。"
      + "要改原本的,請再拖一次資料夾並貼上它的路徑,或下載 patch 自己套用。"));
    const first = e.team  // 多人模式:共用的工作區不能直接改,下載 patch 回去自己套
      ? ["下載 patch", e.passed ? "primary" : "", () => { download(patchUrl(conv, e.patch)); return false; }]
      : [e.copy ? "套用到副本" : "套用到專案", e.passed ? "primary" : "", choose("apply")];
    cardButtons(card, [first, ["先不要", "", choose("keep")], ["捨棄修改", "", choose("discard")]]);
    cards["patch" + e.patch] = card; refreshSoon();
    card.scrollIntoView({ block: "end", behavior: "smooth" });
  },
  applied(e) {
    refreshSoon();
    const card = cards["patch" + e.patch]; if (!card) return;
    card.querySelector(".actions")?.remove();
    card.appendChild(el("div", "result", e.text));
  },
  clear() { bot = null; tools.length = 0; cards = {}; showEmpty(); setBusy(false); refreshSoon(); },
};
const patchUrl = (c, i) => `/api/patch?token=${encodeURIComponent(TOKEN)}&c=${encodeURIComponent(c)}&i=${i}`;

let checkedAt = 0;
const PANEL_EVENTS = new Set(["step", "tool_done", "done", "error", "applied", "clear", "notice"]);
function connect() {
  if (es) es.close();
  const mine = conv;
  pane.liveSeq = Infinity;  // 等 /api/state 告訴我們現在的事件編號,之前的都是重播
  es = new EventSource(`/api/events?token=${encodeURIComponent(TOKEN)}&c=${encodeURIComponent(conv)}`);
  es.onmessage = (m) => {
    if (mine !== conv) return;  // 已經切到別段對話了
    const e = JSON.parse(m.data); (handlers[e.kind] || (() => {}))(e);
    panelEvent(e);  // 右邊面板跟著更新(HSUAN 用了瀏覽器就切到它的畫面)
  };
  // 伺服器重啟後 token 會換,舊頁面會一直用舊 token 重連、畫面默默卡住:確認是 403 就重新載入拿新的
  es.onerror = async () => {
    if (Date.now() - checkedAt < 5000) return;
    checkedAt = Date.now();
    try { if ((await api("/api/state")).status === 403) location.reload(); } catch (e) { /* 伺服器還沒起來,等下次 */ }
  };
}

// ---------- 對話 / 專案(側邊欄) ----------
const convMeta = () => desk.conversations.find((c) => c.id === conv);
function openConv(id) {
  conv = id; store.set("conv", id);
  sideMode = kindOf(convMeta()); store.set("mode", sideMode);
  bot = null; tools.length = 0; cards = {}; dirty.clear(); pendingImages = []; renderThumbs();
  closePage(); closeSide(); setPlanMode(false); setBusy(false); applyMode();
  pane.file = pane.files = null; pane.openDirs.clear(); pane.dirsInit = false;  // 檔案分頁換成這段對話的專案
  showEmpty(); connect(); loadState(); renderSide(); loadPanel();
  input.focus();
}
async function newConv(projectId, kind = sideMode) {
  const project = kind === "code" ? projectId || convMeta()?.project : undefined;  // 對話模式不綁專案
  const r = await api("/api/conv/new", { project, kind });
  if (!r.ok) return alert(r.data.error || "開新對話失敗");
  await loadDesk(); openConv(r.data.id);
}
// 對話模式沒有 @檔案、「先規劃」和「分工」(不綁專案,沒有讀檔、改檔的工具);訪客沒有子助理
function applyMode() {
  const chat = sideMode === "chat";
  document.querySelectorAll(".mode-switch button").forEach((b) => b.setAttribute("aria-pressed", String(b.dataset.mode === sideMode)));
  $("plan-mode").hidden = chat;
  $("split-mode").hidden = chat || !!state.guest;

// null = 分隔線,{header, sub} = 不能按的標題。above:開在 anchor 上面、一樣寬(左下角的帳號選單)
function popup(anchor, items, { above = false } = {}) {
  document.querySelector(".popup")?.remove();
  const box = el("div", "popup");
  box.setAttribute("role", "menu"); box.anchor = anchor;
  for (const it of items) {
    if (!it) { box.appendChild(el("hr")); continue; }
    if (it.node) { box.appendChild(it.node); continue; }  // 自己做好的區塊(努力程度滑桿)
    if (it.header) { const h = box.appendChild(el("div", "head", it.header)); if (it.sub) h.appendChild(el("small", "", it.sub)); continue; }
    const [label, fn, cls, right, ico] = it;
    const b = box.appendChild(button("", cls || "", () => { box.remove(); fn(); }));
    b.setAttribute("role", "menuitem");
    if (ico) b.innerHTML = ico;
    const name = b.appendChild(el("span", "label", Array.isArray(label) ? label[0] : label));
    if (Array.isArray(label)) name.appendChild(el("small", "", label[1]));
    if (right) b.appendChild(el("span", "right", right));
  }
  document.body.appendChild(box);
  const r = anchor.getBoundingClientRect();
  if (above) {
    box.style.left = r.left + 8 + "px"; box.style.width = r.width - 16 + "px";
    box.style.top = Math.max(8, r.top - box.offsetHeight - 6) + "px";
  } else {  // 下面放不下(例如輸入框右下角的選模型)就開在上面
    const h = box.offsetHeight;
    box.style.left = Math.max(8, Math.min(r.left, innerWidth - box.offsetWidth - 8)) + "px";
    box.style.top = (r.bottom + 4 + h > innerHeight - 8 ? Math.max(8, r.top - h - 4) : r.bottom + 4) + "px";
  }
  box.querySelector("button")?.focus({ preventScroll: true });
  setTimeout(() => document.addEventListener("click", function off(ev) {
    if (!box.contains(ev.target)) { box.remove(); document.removeEventListener("click", off); }
  }));
}
function convRow(list, c, waiting) {
  const row = list.appendChild(el("div", "conv"));

  row.onkeydown = (ev) => { if (ev.key === "Enter") row.onclick(); };
  const dot = row.appendChild(el("span", "dot" + (c.busy ? " busy" : waiting.has(c.id) ? " wait" : c.id === conv ? " on" : "")));
  dot.title = c.busy ? "回答中" : waiting.has(c.id) ? "有事等你處理" : "";
  row.appendChild(el("span", "title", c.title));

    ev.stopPropagation();

      ["重新命名", async () => {
        const t = prompt("對話名稱", c.title);

function section(box, title) { box.appendChild(el("h3", "", title)); return box; }
// 「設定 → 記憶」(10/26,像 ChatGPT 的記憶):HSUAN 跨對話記得的事,每段對話都會帶上;可以看、加、刪、整個關掉
async function renderMemory(box) {
  const x = await api("/api/memory");
  box.innerHTML = "";
  if (!x.ok || !x.data.can) return;  // 訪客沒有記憶
  const d = x.data;
  section(box, "記憶");
  box.appendChild(el("p", "lead", "HSUAN 會記住你說過、以後都適用的事(例如回答風格、常用的語言和工具),每段對話都會帶上,"
    + "不用每次重講。對話裡跟它說「記住…」就會記;存在這台電腦,記憶也會跟著每一題送給模型,所以密碼、金鑰不會記。"));
  const set = async (body) => {
    const y = await api("/api/memory", body);
    if (!y.ok) return alert(y.data.error || "設定失敗");
    renderMemory(box);
  };
  box.appendChild(el("div", "actions")).appendChild(button(d.on ? "關閉記憶" : "打開記憶", "pill" + (d.on ? "" : " dark"),
    () => set({ on: !d.on })));
  if (!d.on) box.appendChild(el("p", "lead", "記憶關著:新的一輪不會帶上記得的事,HSUAN 也不會再記新的(記過的留著,打開又會用)。"));
  if (!d.items.length) box.appendChild(el("div", "none", "還沒有記得的事。"));
  else {
    const rows = box.appendChild(el("div", "rows"));
    for (const it of [...d.items].reverse()) {  // 新的在上面
      const row = rows.appendChild(el("div", "row"));
      const g = row.appendChild(el("div", "grow"));
      g.appendChild(el("div", "", it.text));
      g.appendChild(el("small", "", `${fmtTime(it.at)}${it.source ? " · " + it.source : ""}`));
      row.appendChild(el("div", "actions")).appendChild(button("刪除", "pill", () => set({ remove: it.id })));
    }
    box.appendChild(el("p", "lead", `${d.items.length} / ${d.max} 條`));
  }
  const f = box.appendChild(el("div", "field"));
  const inp = f.appendChild(el("input"));
  inp.placeholder = "自己加一條,例如:回答盡量附上面試時可以怎麼講"; inp.maxLength = 200;
  const add = () => inp.value.trim() && set({ add: inp.value });
  inp.onkeydown = (ev) => { if (ev.key === "Enter" && !ev.isComposing) add(); };
  f.appendChild(button("加入", "pill dark", add));
  if (d.items.length) box.appendChild(el("div", "actions")).appendChild(button("全部清除", "pill", () =>
    confirm("確定清除全部記憶?清掉就找不回來了。") && set({ clear: true })));
}

                   "加到主畫面,之後點圖示就打開:iPhone 用 Safari 按「分享」→「加入主畫面」;Android 用 Chrome 按右上「⋮」→「加到主畫面」。第一次從主畫面打開要再輸入一次 PIN。"])

// 每支訪客手機今天用了多少:額度跟你分開,但用的是你的 NVIDIA 金鑰
function renderGuestUsage(box, st, act) {
  const gu = st.guest_usage;
  if (!gu || (!gu.rows.length && !st.guest_pin)) return;
  box.appendChild(el("h3", "", "訪客今天的用量"));
  box.appendChild(el("p", "lead", `每支訪客手機每天 ${fmtTok(gu.limit)} tokens,不會扣你自己的額度;但用的是你的 NVIDIA 金鑰,`
    + `會用掉同一把金鑰的試用點數和速度限制(訪客用得多時,你的問題比較容易遇到忙線)。今天訪客合計 ${fmtTok(gu.total)} tokens。`));
  if (!gu.rows.length) { box.appendChild(el("div", "none", "還沒有訪客配對。")); return; }
  const list = rows(box);
  for (const g of gu.rows) {
    const sub = `今天 ${fmtTok(g.used)} / ${fmtTok(gu.limit)} tokens · ${g.conversations} 段對話`
      + (g.last ? ` · 最後使用 ${fmtTime(g.last)}` : "") + (g.paired ? "" : " · 已取消配對");
    const actions = g.paired ? [button("取消配對", "pill", () => {
      if (confirm(`取消訪客 ${g.id.slice(0, 6)} 的配對?那支手機要重新輸入訪客 PIN 才能再連。`)) act({ id: g.id }, "/api/phone/forget")();
    })] : [];
    const r = row(list, `訪客 ${g.id.slice(0, 6)}` + (g.device ? ` · ${g.device}` : ""), sub, actions);
    paintBar(r.querySelector(".grow").appendChild(el("div", "usage-bar")), g.used, gu.limit);
  }
}

let kbTimer = null;
let kbSearch = { q: "" };  // 試搜尋的問題和結果(建索引時每 1.5 秒重畫頁面,不能弄丟)
function renderKnowledge(box, data) {
  box.appendChild(el("p", "lead", "把一個資料夾的文件(手冊、規章、規格書、會議紀錄…)建成索引。之後在對話裡直接問,"
    + "HSUAN 會照意思找出相關的段落再回答,並附上出處。支援 Markdown、文字檔、CSV、PDF、Word、Excel;檔案改過按「更新」,只會重算改過的。"));
  if (data.backend !== "nim") box.appendChild(el("p", "lead", "注意:建索引時文件內容會送到 build.nvidia.com 算向量,"
    + "找到的段落也會送給模型。只放可以公開的文件(例如專案裡的 demo_knowledge 示範資料夾),不要放公司文件。"));
  if (!data.semantic) box.appendChild(el("p", "lead", "這個環境沒有設定 embedding 模型(models.yaml 的 embedding),只能用關鍵字搜尋。"));
  section(box, "你的知識庫");
  if (!data.items.length) box.appendChild(el("div", "none", data.can_add ? "還沒有知識庫,按下面的「加入資料夾」。" : "這裡不能加知識庫(訪客或多人模式)。"));
  else {
    const list = rows(box);
    for (const it of data.items) {
      const sub = [];
      if (it.company) sub.push("在公司資料夾裡:試用平台上不會搜尋、也不能更新");
      if (it.missing) sub.push("找不到這個資料夾了");
      else if (it.state === "indexing") sub.push(it.progress[1] ? `建索引中… ${it.progress[0]} / ${it.progress[1]}` : "建索引中…");
      else {
        sub.push(`${it.files} 個檔案 · ${it.chunks} 段` + (it.updated ? ` · 更新於 ${fmtTime(it.updated)}` : ""));
        const c = it.changes || {}, n = (c.new || 0) + (c.changed || 0) + (c.removed || 0);
        if (n) sub.push(`有 ${n} 個檔案改過,按「更新」`);
        if (it.chunks && !it.semantic) sub.push("只能用關鍵字搜尋");
        if (it.unreadable.length) sub.push(`讀不到:${it.unreadable.join("、")}`);
        if (it.error) sub.push(`上次更新失敗:${it.error}`);
      }
      const act = (path) => async () => {
        const x = await api(path, { id: it.id });
        if (!x.ok) alert(x.data.error || "失敗");
        renderPage();
      };
      const busyKb = it.state === "indexing";
      const upd = button("更新", "pill", act("/api/knowledge/update")); upd.disabled = busyKb || it.missing;
      const del = button("移除", "pill", () => confirm(`移除知識庫「${it.name}」?只刪掉索引,資料夾裡的文件不會動。`) && act("/api/knowledge/remove")());
      del.disabled = busyKb;
      const rr = row(list, it.name, sub.join(" · "), [upd, del]);
      rr.querySelector(".grow").appendChild(el("small", "", it.path));
    }
  }
  if (data.can_add) {
    box.appendChild(el("div", "actions")).appendChild(button("加入資料夾", "pill dark", async () => {
      const path = prompt("文件資料夾的完整路徑(例如 C:\\Users\\User\\Desktop\\nvidia-dev-assistant-main\\demo_knowledge):");
      if (!path || !path.trim()) return;
      const x = await apiDeclared("/api/knowledge/add", { path });
      if (x.cancelled) return;
      if (!x.ok) return alert(x.data.error || "加入失敗");
      renderPage();
    })).parentElement.style.marginTop = "12px";
  }
  section(box, "試搜尋");
  box.appendChild(el("p", "lead", "看看一個問題會找到哪幾段(不經過模型,不花對話的 token)。"));
  const f = box.appendChild(el("div", "field"));
  const inp = f.appendChild(el("input"));
  inp.placeholder = "例如:請三天假要誰核准?"; inp.value = kbSearch.q;
  inp.oninput = () => { kbSearch.q = inp.value; };
  const go = async () => {
    if (!inp.value.trim()) return;
    const x = await api("/api/knowledge/search", { q: inp.value });
    if (!x.ok) return alert(x.data.error || "搜尋失敗");
    kbSearch = { q: inp.value, ...x.data };
    renderPage();
  };
  inp.onkeydown = (ev) => { if (ev.key === "Enter" && !ev.isComposing) go(); };
  f.appendChild(button("搜尋", "pill dark", go));
  if (kbSearch.hits) {
    if (!kbSearch.hits.length) box.appendChild(el("div", "none", "找不到相關的段落(還沒建好索引,或文件裡沒有寫到)。"));
    else {
      box.appendChild(el("p", "lead", `用「${kbSearch.how}」搜尋,最相關的 ${kbSearch.hits.length} 段:`));
      const list = rows(box);
      for (const h of kbSearch.hits) {
        const rr = row(list, h.where, h.text.length > 160 ? h.text.slice(0, 160) + "…" : h.text);
        rr.querySelector(".grow").prepend(el("span", "tag ok", h.score.toFixed(2)));
      }
    }
  }
  clearTimeout(kbTimer);  // 建索引中:每 1.5 秒看一次進度
  if (data.items.some((it) => it.state === "indexing")) kbTimer = setTimeout(() => page === "knowledge" && renderPage(), 1500);
}

      const test = button("測試", "pill", async (ev) => { ev.target.textContent = "啟動中…"; await act("/api/connectors/test")(); });
      test.disabled = !it.enabled;
      const r = row(list, it.name, sub, [test,
        button(it.enabled ? "關閉" : "打開", "pill", act("/api/connectors/toggle", { on: !it.enabled })),
        button("移除", "pill", () => confirm(`移除連接器「${it.name}」?`) && act("/api/connectors/remove")())]);
      const g = r.querySelector(".grow");
      if (it.state === "error") g.querySelector("small").classList.add("error");
      g.appendChild(el("small", "", it.command + (it.env.length ? `(env:${it.env.join("、")})` : "")));
      if (it.tools.length) g.appendChild(el("small", "", "工具:" + it.tools.map((t) => t.name).join("、")));
    }
  }
  section(box, "加入連接器");
  const ta = box.appendChild(el("textarea", "config"));
  ta.placeholder = MCP_EXAMPLE; ta.value = mcpDraft; ta.spellcheck = false;
  ta.setAttribute("aria-label", "連接器設定(JSON)");
  ta.oninput = () => { mcpDraft = ta.value; };
  const add = async (path, body) => {
    const x = await apiDeclared(path, body);
    if (x.cancelled) return;
    if (!x.ok) return alert(x.data.error || "加入失敗");
    if (path.endsWith("/add")) mcpDraft = "";
    for (const c of x.data.added || []) await api("/api/connectors/test", { id: c.id });  // 馬上啟動一次,看接不接得上
    renderPage();
  };
  const actions = box.appendChild(el("div", "actions"));
  actions.style.marginTop = "10px";
  actions.appendChild(button("加入", "pill dark", () => ta.value.trim() ? add("/api/connectors/add", { config: ta.value }) : ta.focus()));
  actions.appendChild(button("加入示範連接器(虛構的工單系統)", "pill", () => add("/api/connectors/demo", {})));
}

const fmtTok = (n) => n >= 10000 ? `${(n / 10000).toFixed(n >= 1000000 ? 0 : 1).replace(/\.0$/, "")} 萬` : Number(n).toLocaleString();
function paintBar(bar, used, limit) {
  const ratio = limit ? used / limit : 0;
  bar.querySelector("i") || bar.appendChild(el("i"));
  bar.querySelector("i").style.width = `${Math.min(100, ratio * 100)}%`;
  bar.classList.toggle("high", ratio >= 0.8 && ratio < 1);
  bar.classList.toggle("full", ratio >= 1);
}
function renderUsage() {
  const u = state.usage, bar = $("usage-bar");
  bar.hidden = !u;
  $("who-usage").textContent = u ? `今天 ${fmtTok(u.used)} / ${fmtTok(u.limit)} tokens` : (state.model || "");
  if (u) paintBar(bar, u.used, u.limit);
}
function rows(box) { return box.appendChild(el("div", "rows")); }
function row(list, name, sub, actions) {
  const r = list.appendChild(el("div", "row"));
  const g = r.appendChild(el("div", "grow"));
  g.appendChild(el("div", "name", name));
  if (sub) g.appendChild(el("small", "", sub));
  if (actions) { const a = r.appendChild(el("div", "actions")); actions.forEach((x) => a.appendChild(x)); }
  return r;
}

function termOpen(on) {

  $("term-btn").setAttribute("aria-pressed", String(on));

  for (const line of d.lines) {

// ---------- 右邊的面板(10/24 使用者要的,像 Claude 桌面版):狀態 / 變更 / 檔案 / 瀏覽器 ----------

// 事件來了:目前的分頁需要才重新整理;HSUAN 剛用了瀏覽器就切到它看到的畫面(手機上不自動打開,會蓋住對話)

function pcard(box, title) {

const plusMinus = (added, removed) => [el("small", "n-add", `+${added}`), el("small", "n-del", `−${removed}`)];

// 狀態:環境、背景資訊、變更的摘要
function renderStatus(d) {
  const box = paneBox("status"), open = new Set([...box.querySelectorAll(".pfile[open]")].map((x) => x.dataset.key));
  box.innerHTML = "";
  const env = pcard(box, "環境").card;  // 這段對話在哪個專案、哪個分支
  if (!d.env) prow(env, "chat", "對話模式:不綁專案");
  else {
    prow(env, "project", d.env.project);
    if (d.env.path) prow(env, "folder", d.env.path);
    prow(env, "branch", d.env.branch || (d.env.copy ? "副本(不看 git)" : "不是 git 專案"));
    if (d.env.copy) env.appendChild(el("p", "pnote", "這是拖進來的資料夾的副本:套用的修改改在副本,原本的資料夾不會動。"));
  }
  // 背景資訊:這段對話送給模型的內容佔上下文的幾成;超過 summarize_at,下一題開始前會先整理成摘要
  const c = d.context, pct = Math.min(100, Math.round((c.tokens / c.budget) * 100)), high = c.tokens >= c.budget * c.summarize_at;
  const ctx = pcard(box, "背景資訊");
  ctx.right.append(`${pct}%`);
  const ring = ctx.right.appendChild(el("span", "ring" + (high ? " high" : "")));
  ring.style.setProperty("--p", pct);
  ctx.card.appendChild(el("div", "", `約 ${kTokens(c.tokens)} / ${kTokens(c.budget)} tokens`));
  ctx.card.appendChild(el("p", "pnote", `模型:${c.model}`));
  ctx.card.appendChild(el("p", "pnote", high
    ? `超過 ${Math.round(c.summarize_at * 100)}% 了:下一題開始前會先把前面的對話整理成摘要。`
    : `超過 ${Math.round(c.summarize_at * 100)}% 時,下一題開始前會先把前面的對話整理成摘要。`));
  const used = [`這段對話累計 ${kTokens(c.used)} tokens`];
  if (state.usage) used.push(`今天 ${kTokens(state.usage.used)} / ${kTokens(state.usage.limit)}`);
  ctx.card.appendChild(el("p", "pnote", used.join(" · ")));
  if (c.used > 0) cardButtons(ctx.card, [["整理對話", "", async () => {
    const x = await api("/api/compact", {});
    if (x.data.text) alert(x.data.text);
    loadPanel();
  }]]);

  const ch = d.changes, chg = pcard(box, "變更");

    return;
  }
  chg.right.append(...plusMinus(ch.files.reduce((s, f) => s + f.added, 0), ch.files.reduce((s, f) => s + f.removed, 0)));
  for (const f of ch.files) fileDiff(chg.card, f, "d:", open, false);
  draftActions(chg.card, ch);

// 變更:HSUAN 草稿裡還沒套用的(上面)、專案裡還沒 commit 的(下面,git diff,只讀)
function renderChanges(p, g) {
  const box = paneBox("changes"), first = !box.childElementCount;
  const open = first ? null : new Set([...box.querySelectorAll(".pfile[open]")].map((x) => x.dataset.key));
  box.innerHTML = "";
  if (!p || !p.changes) { box.appendChild(el("p", "pnote", "對話模式不綁專案,沒有檔案的變更。")); return; }
  const ch = p.changes, draft = pcard(box, "HSUAN 的草稿(還沒套用)");
  if (!ch.files.length) {
    draft.card.appendChild(el("p", "pnote", "沒有還沒套用的修改。HSUAN 的修改會先放在這裡,你按「套用到專案」才會改到檔案。"));
  } else {
    draft.right.append(...plusMinus(ch.files.reduce((s, f) => s + f.added, 0), ch.files.reduce((s, f) => s + f.removed, 0)));
    for (const f of ch.files) fileDiff(draft.card, f, "d:", open, ch.files.length <= 5);
    draftActions(draft.card, ch);
  }
  const git = pcard(box, "專案裡還沒 commit 的修改");
  const again = git.right.appendChild(button("", "icon-btn", () => loadPanel()));
  again.title = "重新整理"; again.setAttribute("aria-label", "重新整理");
  again.innerHTML = icon('<path d="M16 10a6 6 0 11-1.8-4.3M16 3.5v3h-3"/>');

    return;

  if (!g.files.length && !g.untracked.length) git.card.appendChild(el("p", "pnote", "沒有還沒 commit 的修改。"));
  if (g.files.length) git.right.prepend(...plusMinus(g.files.reduce((s, f) => s + f.added, 0), g.files.reduce((s, f) => s + f.removed, 0)));
  for (const f of g.files) fileDiff(git.card, f, "g:", open, false);
  if (g.more) git.card.appendChild(el("p", "pnote", "檔案太多,只列前面的。"));
  if (g.untracked.length) {
    git.card.appendChild(el("h5", "", `還沒加入 git 的檔案(${g.untracked.length})`));
    for (const u of g.untracked.slice(0, 50)) prow(git.card, "file", u);

// 檔案:專案的檔案樹(唯讀),點開看內容;草稿改過的看到的是草稿版本(跟 HSUAN 讀到的一樣)

  const x = await api("/api/files");

    pane.dirsInit = true;
    if (x.data.files.length <= 80)
      for (const f of x.data.files) { const parts = f.path.split("/"); for (let i = 1; i < parts.length; i++) pane.openDirs.add(parts.slice(0, i).join("/") + "/"); }
  }

}
function renderFiles() {

  if (!d) return;
  box.innerHTML = "";
  const bar = box.appendChild(el("div", "pbar"));
  const q = bar.appendChild(el("input"));
  q.placeholder = "找檔名…"; q.value = pane.filter; q.setAttribute("aria-label", "找檔名");
  const again = bar.appendChild(button("", "icon-btn", loadFiles));
  again.title = "重新整理"; again.setAttribute("aria-label", "重新整理");
  again.innerHTML = icon('<path d="M16 10a6 6 0 11-1.8-4.3M16 3.5v3h-3"/>');
  const list = box.appendChild(el("div", "flist"));
  const fileBtn = (f, label) => {
    const b = button("", "ffile", () => openFile(f.path));
    b.innerHTML = icon(PANEL_ICONS.file); b.title = f.path;
    b.appendChild(el("span", "name", label));
    if (f.draft) b.appendChild(el("span", "tag " + (f.new ? "ok" : "warn"), f.new ? "新增" : "草稿"));
    return b;
  };
  const draw = () => {
    list.innerHTML = "";
    const words = pane.filter.trim().toLowerCase();
    if (words) {  // 有搜尋字:平平列出符合的
      const hits = d.files.filter((f) => f.path.toLowerCase().includes(words));
      for (const f of hits.slice(0, 300)) list.appendChild(fileBtn(f, f.path));
      if (!hits.length) list.appendChild(el("p", "pnote", "沒有符合的檔案"));
      return;
    }
    const root = { dirs: new Map(), files: [] };
    for (const f of d.files) {
      const parts = f.path.split("/");
      let node = root;
      for (const p of parts.slice(0, -1)) {
        if (!node.dirs.has(p)) node.dirs.set(p, { dirs: new Map(), files: [] });
        node = node.dirs.get(p);
      }
      node.files.push([f, parts.at(-1)]);

      for (const name of [...node.dirs.keys()].sort()) {
        const path = prefix + name + "/", det = into.appendChild(el("details", "fdir"));
        det.open = pane.openDirs.has(path);
        det.ontoggle = () => (det.open ? pane.openDirs.add(path) : pane.openDirs.delete(path));
        const sum = det.appendChild(el("summary"));
        sum.innerHTML = icon(PANEL_ICONS.folder); sum.append(name);
        tree(det.appendChild(el("div", "fkids")), node.dirs.get(name), path);
      }
      for (const [f, name] of node.files) into.appendChild(fileBtn(f, name));
    };
    tree(list, root, "");
    if (!d.files.length) list.appendChild(el("p", "pnote", "這個專案沒有看得到的檔案(機密檔、.git、node_modules 這類不會列出來)。"));
    if (d.more) list.appendChild(el("p", "pnote", "檔案太多,只列前面的;用上面的搜尋找。"));
  };

}
async function openFile(path) {

  box.innerHTML = "";
  const bar = box.appendChild(el("div", "pbar"));
  bar.appendChild(button("← 檔案", "pill", () => { pane.file = null; pane.files ? renderFiles() : loadFiles(); }));
  bar.appendChild(el("span", "spacer")).style.flex = "1";
  const at = bar.appendChild(button("@ 附加到問題", "pill", () => {  // 跟自己打 @檔名 一樣:送出時 HSUAN 會讀這個檔案
    input.value = input.value.replace(/\s*$/, input.value.trim() ? " " : "") + `@${path} `;
    autosize(); updateSend(); input.focus();
    if (phoneWidth()) panelOpen(false);
  }));
  at.disabled = /\s/.test(path);  // @ 後面的檔名不能有空白
  if (at.disabled) at.title = "檔名有空白,不能用 @ 附加";
  const head = box.appendChild(el("div", "fhead", path));

  if (pane.file !== path || pane.tab !== "files") return;  // 等的時候已經換了
  if (!x.ok) { box.appendChild(el("p", "pnote", x.data.error || "打不開這個檔案")); return; }
  const d = x.data;
  if (d.draft) { head.prepend(el("span", "tag warn", "草稿")); box.appendChild(el("p", "pnote", "這是 HSUAN 草稿裡的版本(還沒套用到專案)。")); }
  if (d.binary) {
    box.appendChild(el("p", "pnote", "二進位檔(圖片、PDF、Office 檔…),這裡不能顯示。可以用 @ 附加,HSUAN 讀得懂 PDF、Word、Excel 和圖片。"));
    return;
  }

  pre.innerHTML = lines.map((l, i) => `<span class="ln" style="width:${w}ch">${i + 1}</span>${esc(l)}`).join("\n");
  if (d.truncated) box.appendChild(el("p", "pnote", `檔案很大(${fmtSize(d.size)}),只顯示前面的部分。`));

// 瀏覽器:「你的網站」在面板裡預覽開發中的網站(可以點、打字);「HSUAN 的畫面」是它用瀏覽器工具時每個動作後的截圖

    return /^https?:$/.test(x.protocol) && (["localhost", "127.0.0.1", "[::1]"].includes(x.hostname) || /\.(localhost|test)$/.test(x.hostname));
  } catch (e) { return false; }
}

// ---------- 圖片:先在瀏覽器縮小,再跟問題一起送出(伺服器請看圖的模型轉成文字) ----------
const MAX_IMAGES = 4, MAX_SIDE = 1600, KEEP_BYTES = 1_500_000;
function loadImage(file) {
  return new Promise((ok, fail) => {
    const img = new Image(), url = URL.createObjectURL(file);
    img.onload = () => { URL.revokeObjectURL(url); ok(img); };
    img.onerror = () => { URL.revokeObjectURL(url); fail(new Error("讀不出這張圖片(格式不支援?)")); };
    img.src = url;
  });
}
function drawJpeg(img, side, quality) {
  const k = Math.min(1, side / Math.max(img.naturalWidth, img.naturalHeight));
  const c = document.createElement("canvas");
  c.width = Math.max(1, Math.round(img.naturalWidth * k)); c.height = Math.max(1, Math.round(img.naturalHeight * k));
  const g = c.getContext("2d");
  g.fillStyle = "#fff"; g.fillRect(0, 0, c.width, c.height);  // 透明的地方變白(JPEG 沒有透明,不然會變黑)
  g.drawImage(img, 0, 0, c.width, c.height);
  return c.toDataURL("image/jpeg", quality);
}
const readDataURL = (file) => new Promise((ok, fail) => {
  const r = new FileReader(); r.onload = () => ok(r.result); r.onerror = () => fail(new Error("讀不到檔案")); r.readAsDataURL(file);
});
async function prepareImage(file) {
  const img = await loadImage(file);
  // 不大的 PNG / JPEG / WebP 原檔送(截圖的字比較清楚);太大、或其他格式(HEIC、BMP…)縮成 1600px 的 JPEG
  const keep = Math.max(img.naturalWidth, img.naturalHeight) <= MAX_SIDE && file.size <= KEEP_BYTES
    && /^image\/(png|jpeg|webp)$/.test(file.type);
  return { name: file.name || "貼上的圖片", data: keep ? await readDataURL(file) : drawJpeg(img, MAX_SIDE, 0.88),
           thumb: drawJpeg(img, 240, 0.7) };
}
async function addImages(files) {
  for (const f of files) {
    if (!f.type.startsWith("image/")) continue;
    if (pendingImages.length >= MAX_IMAGES) { alert(`一題最多 ${MAX_IMAGES} 張圖`); break; }
    try { pendingImages.push(await prepareImage(f)); } catch (e) { alert(`${f.name}:${e.message}`); }
  }
  renderThumbs(); updateSend(); input.focus();
}
function renderThumbs() {
  const box = $("thumbs"); box.innerHTML = "";

}

// 拖放:整個視窗都收(不用剛好丟在輸入框上);資料夾 → dropFolder,其他檔案當圖片
const hasFiles = (ev) => [...(ev.dataTransfer?.types || [])].includes("Files");
